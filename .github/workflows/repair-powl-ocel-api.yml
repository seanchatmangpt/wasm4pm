name: Materialize POWL OCEL API repair

on:
  push:
    branches:
      - integration/finish-wip-v26.9.1-20260815
    paths:
      - '.github/workflows/repair-powl-ocel-api.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Apply exact bcinr-powl temporal API repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wasm4pm/src/powl_execution.rs')
          s = p.read_text()
          old1 = '.record_op_fired(run_id, i, tape.ops[i as usize].kind as u8)'
          new1 = '.record_op_fired(run_id, i, ticks, 1)'
          old2 = 'ocel_log.record_run_sealed(run_id, op_trace)'
          new2 = 'ocel_log.record_run_sealed(run_id, op_trace, ticks)'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected old bcinr-powl call sites not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          cargo fmt --all
          git diff --check
      - name: Verify repaired package boundary
        run: |
          set -euo pipefail
          cargo check -p wasm4pm --locked --all-features
          cargo check -p wasm4pm --locked --all-features --target wasm32-unknown-unknown
      - name: Publish repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-powl-ocel-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(powl): record deterministic OCEL temporal fields'
          git push origin HEAD:${{ github.ref_name }}
