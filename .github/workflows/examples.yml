name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'crates/wasm4pm-cognition/**'
      - 'wasm4pm/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/bootstrap-cognition-wasm.sh'
      - '.github/workflows/examples.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'crates/wasm4pm-cognition/**'
      - 'wasm4pm/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/bootstrap-cognition-wasm.sh'
      - '.github/workflows/examples.yml'

jobs:
  validate:
    name: Validate examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install examples dependencies
        working-directory: ./examples
        run: npm install

      - name: Validate all examples
        working-directory: ./examples
        run: npm run validate
