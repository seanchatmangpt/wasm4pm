[book]
authors = ["Sean Chatman"]
language = "en"
multilingual = false
src = "src"
title = "Design for Combinatorial Maximalism using all Mermaid"
description = "An Alexander-style pattern language for proof-carrying software and process manufacturing, using wasm4pm as the case study."

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["assets/book.css"]
additional-js = ["assets/mermaid-init.js"]
no-section-label = false
git-repository-url = "https://github.com/seanchatmangpt/wasm4pm"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
