[package]
name = "wasm4pm-ex4pm-bindings"
version = "0.1.0"
edition = "2021"
description = "Phase-1 extern \"C\" WASM export boundary for ex4pm process-intelligence algorithms (discover, conform, simulate, optimize, powl_mine)."
license = "MIT OR Apache-2.0"

[lib]
name = "wasm4pm_ex4pm_bindings"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "deny"
