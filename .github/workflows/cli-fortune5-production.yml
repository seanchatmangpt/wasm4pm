name: CLI Fortune 5 Production

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/wasm4pm/**'
      - 'packages/noun-verb/**'
      - 'scripts/release/verify-cli-fortune5.ts'
      - '.github/workflows/cli-fortune5-production.yml'
  push:
    branches:
      - main
      - 'agent/cli-fortune5-production-closure'
    paths:
      - 'apps/wasm4pm/**'
      - 'packages/noun-verb/**'
      - 'scripts/release/verify-cli-fortune5.ts'
      - '.github/workflows/cli-fortune5-production.yml'

permissions:
  contents: read

concurrency:
  group: cli-fortune5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Select Node-compatible pnpm
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.node }}" = "20" ]; then
            echo "PNPM_VERSION=10.15.0" >> "$GITHUB_ENV"
            npm exec --yes --package=pnpm@10.15.0 -- pnpm --version
          else
            echo "PNPM_VERSION=11.5.2" >> "$GITHUB_ENV"
            npm exec --yes --package=pnpm@11.5.2 -- pnpm --version
          fi

      - name: Install exact CLI dependency closure without ambient lifecycle actuation
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm install --frozen-lockfile --ignore-scripts --filter @wasm4pm/cli... --filter @wasm4pm/noun-verb...

      - name: Build CLI dependency boundary
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm --filter @wasm4pm/noun-verb build

      - name: Build published CLI
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm --filter @wasm4pm/cli build

      - name: Execute CLI package tests
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm --filter @wasm4pm/cli test

      - name: Execute noun-verb framework tests
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm --filter @wasm4pm/noun-verb test

      - name: Execute packaged-binary adversarial verifier
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          WASM4PM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WASM4PM_FORTUNE5_REPORT: artifacts/cli-fortune5/report.json
        shell: bash
        run: npm exec --yes --package="pnpm@$PNPM_VERSION" -- pnpm exec tsx scripts/release/verify-cli-fortune5.ts

      - name: Upload exact-head verifier receipt
        if: success() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: cli-fortune5-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cli-fortune5/report.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and parity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PNPM_VERSION: 11.5.2

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned pnpm
        run: npm exec --yes --package=pnpm@11.5.2 -- pnpm --version

      - name: Install exact CLI dependency closure without ambient lifecycle actuation
        run: npm exec --yes --package=pnpm@11.5.2 -- pnpm install --frozen-lockfile --ignore-scripts --filter @wasm4pm/cli... --filter @wasm4pm/noun-verb...

      - name: Build published surfaces
        run: |
          npm exec --yes --package=pnpm@11.5.2 -- pnpm --filter @wasm4pm/noun-verb build
          npm exec --yes --package=pnpm@11.5.2 -- pnpm --filter @wasm4pm/cli build

      - name: Verify registry and CLI parity
        run: npm exec --yes --package=pnpm@11.5.2 -- pnpm run cli:parity

      - name: Verify clean tarball install and execution
        run: npm exec --yes --package=pnpm@11.5.2 -- pnpm run prepublish:pack-smoke
