[package]
name = "wasm4pm-bindings-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for wasm4pm process mining algorithms"

[lib]
name = "wasm4pm_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.100"
wasm4pm = { workspace = true, features = ["cloud", "ocel", "powl", "feature-powl", "powl-engine", "ml", "conformance_full", "streaming_full", "montecarlo", "petri_net_playout", "extensive_playout", "align_etconformance", "alignment_fitness"] }
wasm4pm-compat = { workspace = true, features = ["formats", "strict", "wasm4pm"] }

# No [dev-dependencies] pyo3 with "auto-initialize": it would unify onto the
# same resolved pyo3 unit as "extension-module" above and pull in
# embedding-only symbols this crate never needs.
#
# pyo3-build-config below is consumed by build.rs, which is the actual fix
# for `cargo build`'s "symbol(s) not found for architecture arm64" — see
# build.rs's doc comment for why.
[build-dependencies]
pyo3-build-config = "0.23"
