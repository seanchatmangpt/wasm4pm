[package]
name = "wasm4pm-cognition"
version = "26.7.23"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman"]
repository = "https://github.com/seanchatmangpt/wasm4pm"
description = "AutoSystems old-AI cognition kernel for wasm4pm: frames, production rules, Prolog, STRIPS, Hearsay-II blackboard, BLAKE3 receipt chain, adversarial gates"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
smallvec = { workspace = true }
indexmap = { version = "2.2", features = ["serde"] }
thiserror = "1"
once_cell = "1.19"
tracing = { workspace = true }
hex = "0.4"
regex = "1.10"
prolog8 = { workspace = true }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"], optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
rand = { version = "0.9", default-features = false, features = ["small_rng"] }

# wasm bindings — gated behind a feature so the crate can be tested
# natively with `cargo test` while still building as cdylib for browsers.
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[features]
default = ["actor-ed25519"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
actor-ed25519 = ["dep:ed25519-dalek", "dep:rand_core"]
actor-mac-fallback = []
# Oracle impls for the universal anti-cheat harness (test-only surface; never default).
breed-oracles = []

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
trybuild = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
divan = "0.1.21"

[[bench]]
name = "breed_latency"
harness = false

[[bench]]
name = "cognition_divan"
harness = false

[[test]]
name = "universal_anticheat"
required-features = ["breed-oracles"]

