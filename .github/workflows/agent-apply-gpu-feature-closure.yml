name: Apply GPU Feature Closure

on:
  push:
    branches:
      - agent/fix-pnpm11-build-allowlist
    paths:
      - '.github/workflows/agent-apply-gpu-feature-closure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pnpm11-build-allowlist
          fetch-depth: 0

      - name: Close the GPU feature dependency graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wasm4pm/Cargo.toml')
          text = path.read_text()
          replacements = {
              'miniml = { workspace = true, optional = true }\n':
                  'miniml = { workspace = true, optional = true }\n'
                  'wgpu = { version = "0.19", optional = true }\n'
                  'pollster = { version = "0.3", optional = true }\n',
              'feature-gpu = []\n': 'feature-gpu = ["gpu"]\n',
              'gpu = []\n': 'gpu = ["dep:wgpu", "dep:pollster"]\n',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Verify all-feature closure
        run: cargo check -p wasm4pm --all-features

      - name: Commit verified manifest and lockfile
        shell: bash
        run: |
          rm .github/workflows/agent-apply-gpu-feature-closure.yml
          git config user.name "wasm4pm-ci"
          git config user.email "actions@users.noreply.github.com"
          git add wasm4pm/Cargo.toml Cargo.lock .github/workflows/agent-apply-gpu-feature-closure.yml
          git commit -m "fix(cargo): close the GPU feature dependency graph"
          git push origin HEAD:agent/fix-pnpm11-build-allowlist
