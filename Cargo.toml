[workspace]
resolver = "2"

members = ["wasm4pm", "tps-metrics", "crates/pictl-types", "crates/pictl-algos"]

[workspace.package]
version = "26.4.16"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/pictl"

[profile.release]
# Optimize for binary size ("z" instead of "3")
opt-level = "z"
# Link-time optimization (already enabled)
lto = true
# Single codegen unit for better optimization
codegen-units = 1
# Remove panic unwinding code to reduce binary size
panic = "abort"
# Strip symbols
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = false
