name: CI Repair Manufacturer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-repair-manufacturer.yml'
      - '.github/workflows/gall-checkpoint.yml'
      - 'scripts/ci/gall_checkpoint.py'
      - 'scripts/ci/test_gall_checkpoint.py'
      - 'scripts/ci/manufacture_alive_repairs.py'
      - 'scripts/ci/alive_repairs/**'
      - 'wasm4pm/benches/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-repair-manufacturer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manufacture:
    name: Construct tested unattached repair commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_PARENT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact admitted parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"

      - name: Materialize pinned Rust constructor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-15 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target wasm32-unknown-unknown
          rustup default nightly-2026-04-15
          rustc --version --verbose
          rustfmt --version
          cargo clippy --version

      - name: Apply admitted deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/manufacture_alive_repairs.py
          python3 scripts/ci/alive_repairs/pnml_whitespace.py
          python3 scripts/ci/alive_repairs/branchless_bloom.py
          python3 scripts/ci/alive_repairs/process_tree_serde.py
          python3 scripts/ci/alive_repairs/membrane_registry.py
          python3 scripts/ci/alive_repairs/cache_test_fence.py
          python3 scripts/ci/alive_repairs/scalability_btree.py

      - name: Verify wasm production compile
        shell: bash
        run: cargo check -p wasm4pm --all-features --target wasm32-unknown-unknown

      - name: Execute wasm4pm library tests
        shell: bash
        run: cargo test -p wasm4pm --all-features --lib

      - name: Execute cognition handoff witness
        shell: bash
        run: cargo test -p wasm4pm-cognition --all-features --test composed_pipeline_breed_handoff

      - name: Enforce repaired crate clippy laws
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p wasm4pm --all-targets --all-features -- -D warnings
          cargo clippy -p wasm4pm-cognition --all-targets --all-features -- -D warnings

      - name: Construct unattached Git candidate and receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-repair-manufacturer
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          root = pathlib.Path.cwd()
          parent = os.environ['EXPECTED_PARENT']
          observed_parent = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          if observed_parent != parent:
              raise SystemExit(
                  f'PARENT_IDENTITY_REFUSED expected={parent} observed={observed_parent}'
              )

          paths = [
              'crates/wasm4pm-cognition/tests/composed_pipeline_breed_handoff.rs',
              'wasm4pm/benches/scalability_benchmark.rs',
              'wasm4pm/src/automembrane.rs',
              'wasm4pm/src/automl_envelope.rs',
              'wasm4pm/src/branchless.rs',
              'wasm4pm/src/cache.rs',
              'wasm4pm/src/pnml_io.rs',
              'wasm4pm/src/prediction_rf.rs',
              'wasm4pm/src/probabilistic/bloom.rs',
              'wasm4pm/src/probabilistic/wasm_bindings.rs',
              'wasm4pm/src/process_tree.rs',
              'wasm4pm/src/statistical_analysis.rs',
          ]
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', *paths], text=True
          ).splitlines()
          if sorted(changed) != sorted(paths):
              raise SystemExit(
                  f'PATCH_SCOPE_REFUSED expected={paths!r} observed={changed!r}'
              )

          api = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          token = os.environ['GH_TOKEN']

          def post(route, body):
              request = urllib.request.Request(
                  api + route,
                  data=json.dumps(body, separators=(',', ':')).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          blobs = []
          tree_entries = []
          for path_text in paths:
              content = (root / path_text).read_bytes()
              blob = post('/git/blobs', {
                  'content': base64.b64encode(content).decode(),
                  'encoding': 'base64',
              })
              blobs.append({
                  'path': path_text,
                  'blob_sha': blob['sha'],
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'bytes': len(content),
              })
              tree_entries.append({
                  'path': path_text,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              })

          base_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          tree = post('/git/trees', {
              'base_tree': base_tree,
              'tree': tree_entries,
          })
          commit = post('/git/commits', {
              'message': (
                  'fix(rust): close exact-head production law failures\n\n'
                  'Repair quick-xml event handling, mask admission, Bloom indexing, '
                  'process-tree serialization, membrane witnesses, unsafe registry '
                  'state, cache witness isolation, stale typed fixtures, and benchmark '
                  'event-map construction without weakening contracts.'
              ),
              'tree': tree['sha'],
              'parents': [parent],
          })

          constructor_files = [
              root / 'scripts/ci/manufacture_alive_repairs.py',
              *sorted((root / 'scripts/ci/alive_repairs').glob('*.py')),
          ]
          constructor_digest = hashlib.sha256()
          constructors = []
          for constructor_path in constructor_files:
              content = constructor_path.read_bytes()
              relative = constructor_path.relative_to(root).as_posix()
              constructor_digest.update(relative.encode())
              constructor_digest.update(b'\0')
              constructor_digest.update(content)
              constructors.append({
                  'path': relative,
                  'sha256': hashlib.sha256(content).hexdigest(),
              })

          receipt = {
              'schema': 'wasm4pm.ci-repair-candidate.v4',
              'standing': 'ALIVE',
              'actuation': 'NONE_UNATTACHED_GIT_OBJECTS_ONLY',
              'parent': parent,
              'base_tree': base_tree,
              'candidate_tree': tree['sha'],
              'candidate_commit': commit['sha'],
              'constructor_set_sha256': constructor_digest.hexdigest(),
              'constructors': constructors,
              'blobs': blobs,
              'commands': [
                  'python3 scripts/ci/manufacture_alive_repairs.py',
                  'python3 scripts/ci/alive_repairs/pnml_whitespace.py',
                  'python3 scripts/ci/alive_repairs/branchless_bloom.py',
                  'python3 scripts/ci/alive_repairs/process_tree_serde.py',
                  'python3 scripts/ci/alive_repairs/membrane_registry.py',
                  'python3 scripts/ci/alive_repairs/cache_test_fence.py',
                  'python3 scripts/ci/alive_repairs/scalability_btree.py',
                  'cargo check -p wasm4pm --all-features --target wasm32-unknown-unknown',
                  'cargo test -p wasm4pm --all-features --lib',
                  'cargo test -p wasm4pm-cognition --all-features --test composed_pipeline_breed_handoff',
                  'cargo clippy -p wasm4pm --all-targets --all-features -- -D warnings',
                  'cargo clippy -p wasm4pm-cognition --all-targets --all-features -- -D warnings',
              ],
          }
          target = root / 'artifacts/ci-repair-manufacturer/receipt.json'
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-repair-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ci-repair-manufacturer/receipt.json
          if-no-files-found: error
          retention-days: 7
