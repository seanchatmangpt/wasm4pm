name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: exact-subject Rust/WASM/TypeScript/CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact head and CI topology
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Topology is open-world: independent verifier/benchmark workflows may be added
          # without invalidating this workflow. Admit the required CI surfaces by identity
          # instead of coupling correctness to an exact global file count.
          test -f .github/workflows/ci.yml
          test -f .github/workflows/dd-ui.yml
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          test "$count" -ge 2
          printf 'subject_sha=%s\nworkflow_count=%s\n' "$EXPECTED_SHA" "$count"

      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # nightly-2026-04-15
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install declared Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          node --version
          pnpm --version

      - name: Install wasm-pack 0.13.1
        shell: bash
        run: |
          set -euo pipefail
          cargo install wasm-pack --version 0.13.1 --locked
          test "$(wasm-pack --version)" = "wasm-pack 0.13.1"

      - name: Install immutable JavaScript dependency graph
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log

      - name: Preserve pnpm install failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-failure-${{ github.run_id }}
          path: /tmp/pnpm-install.log
          if-no-files-found: error
          retention-days: 14

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust compile
        run: cargo check --workspace --all-targets --locked

      - name: Command projection exact falsifiers
        run: cargo test -p wasm4pm-cognition --test command_projection --locked

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: WASM compile and Node bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p wasm4pm -p wasm4pm-cognition --target wasm32-unknown-unknown --features wasm
          wasm-pack build wasm4pm --target nodejs --out-dir pkg -- --features cloud
          test -s wasm4pm/pkg/wasm4pm.js
          test -s wasm4pm/pkg/wasm4pm_bg.wasm

      - name: WASM simd128 target-feature check (SIMD lane handoff)
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="-C target-feature=+simd128" cargo check -p wasm4pm --target wasm32-unknown-unknown --features wasm

      - name: Cognition WASM node and web bundles
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cognition-wasm.sh
          test -s crates/wasm4pm-cognition/pkg/wasm4pm_cognition.js
          test -s packages/cognition/pkg-web/wasm4pm_cognition.js
          test -s packages/cognition/pkg-web/wasm4pm_cognition_bg.wasm

      - name: TypeScript build
        # @wasm4pm/engine and @wasm4pm/testing depend on each other, so a parallel
        # `pnpm -r build` races engine's tsc against testing's dist. Build the
        # leaves first, then serialize the rest.
        run: |
          pnpm --filter @wasm4pm/contracts build
          pnpm --filter @wasm4pm/testing build
          pnpm -r --workspace-concurrency=1 --if-present run build

      - name: Python test dependencies (interview-assist SPARQL routing + sandbox pytest)
        run: python3 -m pip install "rdflib==7.6.0" "pytest==9.0.3"

      - name: TypeScript integration tests
        run: pnpm test

      - name: Published CLI build and real execution
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @wasm4pm/cli run build
          node apps/wasm4pm/dist/bin/wpm.js model discover data/small-example.xes -a dfg --json > /tmp/discover.json
          node -e 'const x=require("/tmp/discover.json"); if (!JSON.stringify(x).toLowerCase().includes("dfg")) process.exit(1)'
          node apps/wasm4pm/dist/bin/wpm.js system doctor --json > /tmp/doctor.json
          node -e 'const x=require("/tmp/doctor.json"); if (!JSON.stringify(x).includes("ok")) process.exit(1)'

      - name: Packed artifact smoke
        run: pnpm run prepublish:pack-smoke

      - name: Emit verification receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          count="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          cat > artifacts/ci/receipt.json <<JSON
          {"repository":"${GITHUB_REPOSITORY}","subject_sha":"${SUBJECT_SHA}","workflow":"${GITHUB_WORKFLOW}","run_id":"${GITHUB_RUN_ID}","standing":"ALIVE","workflow_count":${count},"boundaries":["rust","wasm","typescript","wpm-cli","pack-smoke"]}
          JSON
          cat artifacts/ci/receipt.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-${{ github.run_id }}
          path: artifacts/ci/receipt.json
          if-no-files-found: error
          retention-days: 14

  bench-gate:
    name: quick-subset bench gate (fast_algorithms + breed_latency vs main)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject (PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout main as comparison subject
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          path: bench-main-src

      - name: Admit exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # nightly-2026-04-15
        with:
          toolchain: nightly-2026-04-15

      # Quick subset only; the calibration anchor (calibration/anchor in
      # breed_latency) is a machine-speed drift detector: it is measured on
      # both subjects and used for cross-host normalization by bench-tools
      # regress, never as a pass/fail benchmark.
      - name: Bench quick subset on PR head
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p wasm4pm --bench fast_algorithms --locked
          cargo bench -p wasm4pm-cognition --bench breed_latency --locked

      - name: Bench quick subset on main
        shell: bash
        run: |
          set -euo pipefail
          cd bench-main-src
          cargo bench -p wasm4pm --bench fast_algorithms --locked
          cargo bench -p wasm4pm-cognition --bench breed_latency --locked

      - name: Build bench-tools (head tree)
        shell: bash
        run: cargo build -p bench-tools --release --locked

      - name: Sign main baseline receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench
          ./target/release/bench-tools receipt \
            --criterion-dir bench-main-src/target/criterion \
            --out /tmp/bench/baseline-main.json \
            --allow-dirty \
            --print

      - name: Regress gate (head medians vs signed main baseline)
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/bench-tools regress \
            --criterion-dir target/criterion \
            --baseline /tmp/bench/baseline-main.json \
            --threshold 25 \
            --min-coverage 0.5

      - name: Emit bench receipt
        if: always()
        shell: bash
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/bench
          ./target/release/bench-tools receipt \
            --criterion-dir target/criterion \
            --out artifacts/bench/bench-receipt.json \
            --allow-dirty \
            --print
          python3 - <<'PY'
          import json, os
          p="artifacts/bench/bench-receipt.json"
          r=json.load(open(p))
          r["head_sha"]=os.environ.get("SUBJECT_SHA")
          r["main_sha"]=os.popen("git -C bench-main-src rev-parse HEAD").read().strip()
          r["gate"]="bench-tools regress threshold=25% vs signed main baseline; calibration anchor excluded from pass/fail"
          json.dump(r, open(p,"w"), indent=2, sort_keys=True)
          print(json.dumps(r, indent=2)[:1200])
          PY

      - name: Upload bench receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-receipt-${{ github.run_id }}
          path: artifacts/bench/bench-receipt.json
          if-no-files-found: warn
          retention-days: 14
