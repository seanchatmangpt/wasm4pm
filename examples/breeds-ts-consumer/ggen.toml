# Working example: generate TypeScript cognition-breed bindings from the
# wasm4pm-breeds-ts pack. Run `ggen sync` here, then `npm run start`.
[project]
name        = "breeds-ts-consumer"
version     = "0.1.0"
description = "Working example consuming the wasm4pm-breeds-ts ggen pack."
authors     = ["wasm4pm"]
license     = "MIT"

[ontology]
source  = "../../packs/wasm4pm-breeds-ts/ggen/ontology/breeds.ttl"
standard_only = false

[inference]
rules = [ { name = "mark-breeds", construct = "CONSTRUCT { ?b <https://wasm4pm.dev/ns#isBreed> true } WHERE { ?b a <https://wasm4pm.dev/ns#CognitionBreed> }" } ]

[generation]
output_dir = "."

[[generation.rules]]
name        = "breed-ids"
query       = { file = "../../packs/wasm4pm-breeds-ts/ggen/queries/extract-breeds.rq" }
template    = { file = "../../packs/wasm4pm-breeds-ts/ggen/templates/breed-ids.ts.tera" }
output_file = "src/breed-ids.ts"
mode        = "Overwrite"

[[generation.rules]]
name        = "breed-catalog"
query       = { file = "../../packs/wasm4pm-breeds-ts/ggen/queries/extract-breeds.rq" }
template    = { file = "../../packs/wasm4pm-breeds-ts/ggen/templates/breed-catalog.ts.tera" }
output_file = "src/breed-catalog.ts"
mode        = "Overwrite"
