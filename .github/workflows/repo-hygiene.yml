name: Repo Hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-paths:
    name: Reject forbidden paths
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject build artifacts, orphan dirs, stray lockfiles
        run: |
          set -euo pipefail

          BASE="${{ steps.base.outputs.ref }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi

          # Files added or modified relative to the base.
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD || true)

          BLOCKED=$(printf '%s\n' "$CHANGED" | grep -E \
            '(^|/)target/|(^|/)undefined/|^apps/wasm4pm/wasm4pm/|^(crates/.+|wasm4pm)/Cargo\.lock$|^package-lock\.json$' \
            || true)

          if [ -n "$BLOCKED" ]; then
            echo "::error::Forbidden paths in changeset:"
            printf '  %s\n' $BLOCKED
            cat <<'EOF'

          Forbidden patterns:
            - target/                : Cargo build output; never commit.
            - **/undefined/          : Orphan from unset test tmpDir; fix the test, don't commit the residue.
            - apps/wasm4pm/wasm4pm/  : Doubly-nested path bug; audits go under .wasm4pm/audits/ instead.
            - <member>/Cargo.lock    : Workspace members share the root Cargo.lock.
            - package-lock.json      : This repo uses pnpm; commit pnpm-lock.yaml instead.

          To fix locally:
            git rm -r --cached <offending-path>
            git commit --amend
          EOF
            exit 1
          fi

          echo "✓ No forbidden paths in changeset."
