[package]
name = "wasm4pm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The official wasm4pm process mining command-line interface"

[[bin]]
name = "wpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = "0.11"
colored = "2.1"
indicatif = "0.17"
wasm4pm-compat.workspace = true
wasm4pm-types.workspace = true
wasm4pm-algos = { version = "26.6.5", path = "../wasm4pm-algos" }
wasm4pm = { version = "26.6.5", path = "../../wasm4pm", features = ["cloud"] }
ocel-core = { version = "26.6.5", path = "../ocel-core" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
