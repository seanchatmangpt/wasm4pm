[package]
name = "wasm4pm"
version = "0.1.0"
edition = "2021"

[dependencies]
bcinr = "26.4.18"
fastrand = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
hashbrown = "0.14"

[dev-dependencies]
criterion = "0.5"
process_mining = "0.5.4"

[lib]
path = "src/lib.rs"

[[bench]]
name = "real_data_bench"
harness = false
