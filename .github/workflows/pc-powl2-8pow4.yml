name: PC-POWL2 8^4 DfCM

on:
  pull_request:
    branches:
      - main
      - agent/pc-powl2-engine
    paths:
      - "wasm4pm/src/pc_powl2/dfcm.rs"
      - "wasm4pm/src/pc_powl2/mod.rs"
      - ".github/workflows/pc-powl2-8pow4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-powl2-8pow4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: Exact 4096-cell closure and replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
      - name: Normalize Rust sources
        run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- wasm4pm/src/pc_powl2/dfcm.rs wasm4pm/src/pc_powl2/mod.rs; then
            exit 0
          fi
          git config user.name "pc-powl2-dfcm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wasm4pm/src/pc_powl2/dfcm.rs wasm4pm/src/pc_powl2/mod.rs
          git commit -m "Format exact PC-POWL2 8^4 closure"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Require committed formatting
        run: git diff --exit-code -- wasm4pm/src/pc_powl2/dfcm.rs wasm4pm/src/pc_powl2/mod.rs
      - name: Manufacture, classify, and replay H(4,8)
        run: cargo test -p wasm4pm pc_powl2::dfcm
      - name: Refuse warnings and weak formulations
        run: cargo clippy -p wasm4pm --tests -- -D warnings
