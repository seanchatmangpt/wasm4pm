name: Challenger enterprise architecture benchmark

on:
  push:
    branches:
      - agent/validate-last24h-benchmarks-20260809
    paths:
      - 'wasm4pm/benches/enterprise_architecture.rs'
      - 'wasm4pm/examples/fortune5_decision_economics.rs'
      - 'wasm4pm/bench_data/receipt.xes'
      - 'wasm4pm/src/**'
      - 'wasm4pm/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/enterprise-architecture-bench.yml'
      - 'docs/benchmarks/challenger-enterprise-architecture.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-04-15 --profile minimal
          rustup default nightly-2026-04-15
          rustc --version
          cargo --version

      - name: Identify exact evidence subject
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "dataset_sha256=$(sha256sum wasm4pm/bench_data/receipt.xes | cut -d' ' -f1)"
            echo "dataset_bytes=$(wc -c < wasm4pm/bench_data/receipt.xes | tr -d ' ')"
          } | tee enterprise-subject.txt

      - name: Execute Fortune 5 decision-economics rail
        shell: bash
        run: |
          set -euo pipefail
          cargo run \
            --manifest-path wasm4pm/Cargo.toml \
            --release \
            --example fortune5_decision_economics \
            --locked \
            2>&1 | tee enterprise-benchmark.log

      - name: Validate measured numbers and manufacture thesis table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import re
          from pathlib import Path

          log = Path("enterprise-benchmark.log").read_text()
          lines = log.splitlines()
          result_lines = [line for line in lines if line.startswith("FORTUNE5_RESULT\t")]
          discovery = [line for line in lines if line.startswith("DISCOVERY_RESULT\t")]
          subject = [line for line in lines if line.startswith("FORTUNE5_SUBJECT\t")]
          complete = [line for line in lines if line.startswith("FORTUNE5_COMPLETE\t")]

          if len(discovery) != 1 or len(subject) != 1 or len(complete) != 1:
              raise SystemExit("REFUSED: missing unique discovery/subject/completion receipt")
          if len(result_lines) != 16:
              raise SystemExit(f"REFUSED: expected 16 measured frontier rows, observed {len(result_lines)}")

          def fields(line):
              return dict(part.split("=", 1) for part in line.split("\t")[1:])

          rows = [fields(line) for line in result_lines]
          scales = [int(row["scale"]) for row in rows]
          if 10_000_000 not in scales:
              raise SystemExit("REFUSED: flagship 10,000,000-envelope execution absent")

          total = 0
          for row in rows:
              scale = int(row["scale"])
              admitted = int(row["admitted"])
              refused = int(row["refused"])
              elapsed_ns = int(row["elapsed_ns"])
              rate = float(row["ebaa_per_second"])
              receipt = row["final_receipt"]
              if admitted + refused != scale:
                  raise SystemExit(f"REFUSED: standing mismatch for {row['family']}@{scale}")
              if elapsed_ns <= 0 or rate <= 0:
                  raise SystemExit(f"REFUSED: non-positive measurement for {row['family']}@{scale}")
              if not re.fullmatch(r"[0-9a-f]{64}", receipt):
                  raise SystemExit(f"REFUSED: invalid receipt for {row['family']}@{scale}")
              total += scale

          completion = fields(complete[0])
          planned = int(completion["planned_evaluations"])
          if total != planned:
              raise SystemExit(f"REFUSED: executed total {total} != planned total {planned}")
          if total < 30_000_000:
              raise SystemExit(f"REFUSED: massive rail too small: {total}")

          # Recalculate throughput from raw elapsed time and bound the logged value.
          for row in rows:
              raw = int(row["scale"]) / (int(row["elapsed_ns"]) / 1e9)
              logged = float(row["ebaa_per_second"])
              relative_error = abs(raw - logged) / raw
              if relative_error > 1e-6:
                  raise SystemExit(
                      f"REFUSED: throughput arithmetic drift {row['family']}@{row['scale']}: {relative_error}"
                  )

          out = Path("fortune5-results.csv")
          with out.open("w", newline="") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "family", "scale", "admitted", "refused", "elapsed_ns",
                      "ebaa_per_second", "final_receipt"
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)

          fastest = max(rows, key=lambda row: float(row["ebaa_per_second"]))
          flagship = next(
              row for row in rows
              if row["family"] == "governance_portfolio_frontier" and int(row["scale"]) == 10_000_000
          )
          flagship_rate = float(flagship["ebaa_per_second"])
          one_hour = flagship_rate * 3600
          one_day = flagship_rate * 86400
          one_week = flagship_rate * 604800
          log_sha = hashlib.sha256(log.encode()).hexdigest()

          summary = f"""# Fortune 5 Enterprise Architecture Benchmark Receipt

          ## Observed execution

          - Executed decision envelopes: **{total:,}**
          - Largest single measured frontier: **10,000,000** envelopes
          - Flagship measured throughput: **{flagship_rate:,.0f} evidence-bound architectural alternatives/second**
          - Fastest measured row: **{float(fastest['ebaa_per_second']):,.0f} EBAA/s** ({fastest['family']} @ {int(fastest['scale']):,})
          - Benchmark log SHA-256: `{log_sha}`

          ## Derived human-latency arbitrage

          These are arithmetic projections from the measured 10,000,000-envelope flagship rate, not separately executed envelope counts.

          - One hour: **{one_hour:,.0f}** alternatives
          - One day: **{one_day:,.0f}** alternatives
          - One week: **{one_week:,.0f}** alternatives

          ## Claim boundary

          The stress rail reuses semantic roots manufactured from the checked-in real XES process evidence. Its EBAA/s numbers measure deterministic policy/conformance/receipt envelope evaluation over those roots. They are **not** full process-discovery operations per second. The separate `DISCOVERY_RESULT` line records the real process-semantics manufacture cost.
          """
          Path("fortune5-summary.md").write_text("\n".join(line.strip() for line in summary.splitlines()) + "\n")
          print(summary)
          PY

      - name: Manufacture benchmark receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            cat enterprise-subject.txt 2>/dev/null || true
            echo "log_sha256=$(sha256sum enterprise-benchmark.log 2>/dev/null | cut -d' ' -f1 || true)"
            echo "results_sha256=$(sha256sum fortune5-results.csv 2>/dev/null | cut -d' ' -f1 || true)"
            echo "summary_sha256=$(sha256sum fortune5-summary.md 2>/dev/null | cut -d' ' -f1 || true)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee enterprise-receipt.txt

      - name: Upload exact-head benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenger-enterprise-architecture-${{ github.sha }}
          path: |
            enterprise-subject.txt
            enterprise-benchmark.log
            enterprise-receipt.txt
            fortune5-results.csv
            fortune5-summary.md
          if-no-files-found: warn
          retention-days: 30
