name: PC-POWL2 8^4 DfCM

on:
  pull_request:
    branches:
      - main
      - agent/pc-powl2-engine
    paths:
      - "wasm4pm/src/pc_powl2/dfcm.rs"
      - "wasm4pm/src/pc_powl2/mod.rs"
      - ".github/workflows/pc-powl2-8pow4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-powl2-8pow4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: Exact 4096-cell closure and replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
      - name: Require committed formatting for owned Rust files
        run: >-
          rustfmt --edition 2021 --check --config skip_children=true
          wasm4pm/src/pc_powl2/dfcm.rs
          wasm4pm/src/pc_powl2/mod.rs
      - name: Manufacture, classify, and replay H(4,8)
        id: closure_test
        continue-on-error: true
        run: cargo test -p wasm4pm --lib pc_powl2::dfcm > pc-powl2-8pow4-test.log 2>&1
      - name: Upload closure test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-8pow4-test-log
          path: pc-powl2-8pow4-test.log
          if-no-files-found: error
      - name: Surface closure test refusal
        if: steps.closure_test.outcome != 'success'
        run: |
          tail -n 120 pc-powl2-8pow4-test.log
          exit 1
      - name: Refuse warnings and weak formulations
        id: closure_clippy
        continue-on-error: true
        run: cargo clippy -p wasm4pm --lib -- -D warnings > pc-powl2-8pow4-clippy.log 2>&1
      - name: Upload clippy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-8pow4-clippy-log
          path: pc-powl2-8pow4-clippy.log
          if-no-files-found: error
      - name: Surface clippy refusal
        if: steps.closure_clippy.outcome != 'success'
        run: |
          tail -n 120 pc-powl2-8pow4-clippy.log
          exit 1
