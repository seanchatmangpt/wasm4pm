name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'apps/wasm4pm/**'
      - 'crates/wasm4pm-cognition/**'
      - 'packages/**'
      - 'wasm4pm/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'examples/**'
      - 'apps/wasm4pm/**'
      - 'crates/wasm4pm-cognition/**'
      - 'packages/**'
      - 'wasm4pm/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  validate:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install examples dependencies
        run: cd examples && npm install

      - name: Validate all examples
        run: cd examples && npm run validate

  interview-assist-wpm:
    name: InterviewAssist through wpm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install workspace and materialize cognition WASM
        run: pnpm install --no-frozen-lockfile

      - name: Build wpm
        run: pnpm --filter @wasm4pm/cli build

      - name: Typecheck wpm process test
        run: pnpm --filter @wasm4pm/cli typecheck:tests

      - name: Run InterviewAssist through wpm
        run: pnpm --filter @wasm4pm/cli exec vitest run src/__tests__/interview-assist-cli.test.ts --reporter=verbose
