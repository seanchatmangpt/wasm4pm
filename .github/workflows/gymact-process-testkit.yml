name: GymAct process testkit

on:
  pull_request:
    paths:
      - "crates/wasm4pm-testing/**"
      - ".github/workflows/gymact-process-testkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/wasm4pm-testing/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path crates/wasm4pm-testing/Cargo.toml --all-targets
      - name: Test modeled integration laws
        run: cargo test --manifest-path crates/wasm4pm-testing/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path crates/wasm4pm-testing/Cargo.toml --all-targets -- -D warnings
