name: PC-POWL2 Hardening and 8^4 Conformance

on:
  pull_request:
    branches:
      - main
      - agent/pc-powl2-engine
    paths:
      - "wasm4pm/src/pc_powl2/**"
      - ".github/workflows/pc-powl2-8pow4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-powl2-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-receipt-repair:
    name: Repair exact focused refusals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-powl2-8pow4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
      - name: Apply exact refusal and visibility repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dfcm = Path("wasm4pm/src/pc_powl2/dfcm.rs")
          source = dfcm.read_text()
          old = '''            CaseOutcome::Refused {
                          phase: FailurePhase::Verify,
                          refusal: PcpRefusal::CanonicalContractFailed { .. },
                      }
          '''
          new = '''            CaseOutcome::Refused {
                          phase: FailurePhase::Verify,
                          refusal: PcpRefusal::IndependentActionsDoNotCommute {
                              left: PowlNodeId(0),
                              right: PowlNodeId(1),
                          },
                      }
          '''
          if source.count(old) != 1:
              raise SystemExit("DfCM refusal assertion context mismatch")
          dfcm.write_text(source.replace(old, new))

          broker = Path("wasm4pm/src/pc_powl2/broker.rs")
          source = broker.read_text()
          old = "    pub fn execute_with<D, A>(\n"
          new = "    pub(crate) fn execute_with<D, A>(\n"
          if source.count(old) != 1:
              raise SystemExit("execute_with visibility context mismatch")
          broker.write_text(source.replace(old, new))
          PY
          rustfmt --edition 2021 --config skip_children=true \
            wasm4pm/src/pc_powl2/broker.rs \
            wasm4pm/src/pc_powl2/dfcm.rs
          git diff --check -- wasm4pm/src/pc_powl2
      - name: Verify repaired focused rail
        run: cargo test -p wasm4pm --lib pc_powl2
      - name: Refuse focused warnings
        run: cargo clippy -p wasm4pm --lib -- -D warnings
      - name: Commit exact receipt repairs
        run: |
          git config user.name "pc-powl2-receipt-broker"
          git config user.email "actions@users.noreply.github.com"
          git add wasm4pm/src/pc_powl2/broker.rs wasm4pm/src/pc_powl2/dfcm.rs
          git diff --cached --quiet && exit 0
          git commit -m "Repair PC-POWL2 refusal and actuator visibility"
          git push origin HEAD:agent/pc-powl2-8pow4
