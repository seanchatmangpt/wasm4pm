[package]
name = "pictl-types"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binary data structures for pictl process mining platform"
repository = "https://github.com/seanchatmangpt/pictl"

[dependencies]
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.105"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
blake3 = { version = "1.5.0", features = ["serde"] }
rustc-hash = "2"

[dev-dependencies]
serde_json = "1.0.105"
