[workspace]
resolver = "2"

members = ["wasm4pm", "tps-metrics", "crates/wasm4pm-types", "crates/wasm4pm-algos", "crates/wasm4pm-cli", "crates/wasm4pm-utils"]

[workspace.package]
version = "26.4.28"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
itertools = "0.14.0"
rustc-hash = "2"
blake3 = "1.5"
bcinr = { version = "26.4.22", default-features = false }
wasm4pm-types = { version = "26.4.17", path = "crates/wasm4pm-types" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = false
