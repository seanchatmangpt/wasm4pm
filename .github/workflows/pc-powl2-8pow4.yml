name: PC-POWL2 Hardening and 8^4 Conformance

on:
  pull_request:
    branches:
      - main
      - agent/pc-powl2-engine
    paths:
      - "wasm4pm/src/pc_powl2/**"
      - ".github/workflows/pc-powl2-8pow4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-powl2-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    name: Checker, broker, replay, and 4096-case conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
      - name: Refuse retired symbolic standing machinery
        run: |
          ! grep -R "StandingCeiling\|SemanticMutationAfterReceipt\|OperatorWord" wasm4pm/src/pc_powl2
          ! grep -R "DFCM_ADMITTED_WORD_COUNT\|DFCM_REFUSED_WORD_COUNT" wasm4pm/src/pc_powl2
      - name: Refuse staging and self-modifying CI scaffolding
        run: |
          test ! -e .agents/pc-powl2-hardening
          test ! -e .github/workflows/apply-pc-powl2-hardening.yml
          test ! -e .github/workflows/format-pc-powl2-hardening.yml
      - name: Manufacture formatted authority candidate
        id: formatting
        continue-on-error: true
        run: |
          rustfmt --edition 2021 --config skip_children=true \
            wasm4pm/src/pc_powl2/mod.rs \
            wasm4pm/src/pc_powl2/checker.rs \
            wasm4pm/src/pc_powl2/commutation.rs \
            wasm4pm/src/pc_powl2/broker.rs \
            wasm4pm/src/pc_powl2/dfcm.rs \
            wasm4pm/src/pc_powl2/tests.rs
          git diff --exit-code -- wasm4pm/src/pc_powl2
      - name: Upload formatted authority receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-formatted-authority
          path: wasm4pm/src/pc_powl2
          if-no-files-found: error
      - name: Refuse uncommitted formatting
        if: steps.formatting.outcome != 'success'
        run: exit 1
      - name: Run checker, broker, replay, falsifier, and 4096-case suite
        id: hardening_test
        continue-on-error: true
        run: cargo test -p wasm4pm --lib pc_powl2 > pc-powl2-hardening-test.log 2>&1
      - name: Upload hardening test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-hardening-test-log
          path: pc-powl2-hardening-test.log
          if-no-files-found: error
      - name: Surface hardening refusal
        if: steps.hardening_test.outcome != 'success'
        run: |
          tail -n 160 pc-powl2-hardening-test.log
          exit 1
      - name: Refuse warnings and weak formulations
        id: hardening_clippy
        continue-on-error: true
        run: cargo clippy -p wasm4pm --lib -- -D warnings > pc-powl2-hardening-clippy.log 2>&1
      - name: Upload clippy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-hardening-clippy-log
          path: pc-powl2-hardening-clippy.log
          if-no-files-found: error
      - name: Surface clippy refusal
        if: steps.hardening_clippy.outcome != 'success'
        run: |
          tail -n 160 pc-powl2-hardening-clippy.log
          exit 1
