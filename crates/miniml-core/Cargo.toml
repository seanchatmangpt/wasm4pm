
[package]
name = "miniml"
version.workspace = true
edition = "2021"
authors = ["Sean Chatman <info@chatmangpt.com>"]
description = "A minimal, blazing-fast WASM-powered machine learning library with SIMD acceleration"
license.workspace = true
repository = "https://github.com/seanchatmangpt/miniml"
keywords = ["machine-learning", "wasm", "statistics", "minimal", "simd"]
categories = ["wasm", "science", "mathematics"]
autobenches = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["simd"]
simd = []
no-simd = []

[dependencies]
wasm-bindgen = { workspace = true, features = ["serde-serialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"
base64 = "0.23"
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = { workspace = true }
