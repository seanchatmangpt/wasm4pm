name: Cloud Agent bootstrap

on:
  pull_request:
    paths:
      - '.cursor/install.sh'
      - '.github/workflows/cloud-agent-bootstrap.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - 'apps/wasm4pm/**'
      - 'wasm4pm/**'
  push:
    branches: [main]
    paths:
      - '.cursor/install.sh'
      - '.github/workflows/cloud-agent-bootstrap.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - 'apps/wasm4pm/**'
      - 'wasm4pm/**'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: pnpm
      - name: Verify shell admission
        run: bash -n .cursor/install.sh
      - name: Execute fresh bootstrap
        run: bash .cursor/install.sh
      - name: Replay idempotently
        run: bash .cursor/install.sh
      - name: Verify executable boundary
        run: |
          test -s wasm4pm/pkg/wasm4pm.js
          test -s wasm4pm/pkg/wasm4pm_bg.wasm
          node --import tsx apps/wasm4pm/src/bin/wpm.ts model discover data/small-example.xes -a dfg --human | tee /tmp/discover.out
          node --import tsx apps/wasm4pm/src/bin/wpm.ts system doctor --human | tee /tmp/doctor.out
          grep -qi 'dfg' /tmp/discover.out
          grep -Eqi 'status.*ok|42 pass' /tmp/doctor.out
          echo 'CLOUD_AGENT_BOOTSTRAP_ALIVE'
