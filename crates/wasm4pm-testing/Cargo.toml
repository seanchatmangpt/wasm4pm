[package]
name = "wasm4pm-testing"
version = "26.8.7"
edition = "2021"
description = "Evidence-bounded testkit for GymAct, OCEL, conformance, and process-oracle integration patterns"
license = "BUSL-1.1"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"
publish = false

# This crate is intentionally an isolated test harness rather than a release
# workspace member. It models cross-repository contracts without changing
# wasm4pm's published dependency graph or requiring a Cargo.lock edit just to
# exercise the integration court.
[workspace]

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.4"
