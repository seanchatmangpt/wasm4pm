[package]
name = "wasm4pm-types"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Binary data structures for wasm4pm process mining platform"
repository = "https://github.com/seanchatmangpt/wasm4pm"
documentation = "https://docs.rs/wasm4pm-types"
readme = "README.md"

[dependencies]
wasm4pm-compat = { path = "../../../wasm4pm-compat", features = ["wasm4pm"], optional = true }
ocel-core = { path = "../ocel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hashbrown = { workspace = true }
smallvec = { workspace = true }
blake3 = { workspace = true }
rustc-hash = { workspace = true }
quick-xml = { version = "0.37", optional = true }
flate2 = { version = "1.0", optional = true }

[features]
import      = ["quick-xml", "flate2"]
compat      = ["dep:wasm4pm-compat"]

[dev-dependencies]
serde_json = { workspace = true }
