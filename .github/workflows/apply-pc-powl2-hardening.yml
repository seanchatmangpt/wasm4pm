name: Apply PC-POWL2 Hardening

on:
  pull_request:
    branches:
      - agent/pc-powl2-engine
    paths:
      - ".agents/pc-powl2-hardening/**"
      - ".github/workflows/apply-pc-powl2-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pc-powl2-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt
      - name: Assemble and verify payload
        run: |
          cat .agents/pc-powl2-hardening/part*.b64 > /tmp/pc-powl2-hardening.b64
          test "$(sha256sum /tmp/pc-powl2-hardening.b64 | cut -d' ' -f1)" = "30e4bd0aa52de7fb37566fd51cbb5c21a04a80ec28fb5c2d770f4b36f92eae57"
          base64 --decode /tmp/pc-powl2-hardening.b64 > /tmp/pc-powl2-hardening.tar.gz
          test "$(sha256sum /tmp/pc-powl2-hardening.tar.gz | cut -d' ' -f1)" = "f901c52bcc4af2f009de3a87503e5d74796340dd713baa7b1b4f84459287c674"
      - name: Upload exact payload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-powl2-hardening-payload
          path: |
            /tmp/pc-powl2-hardening.b64
            /tmp/pc-powl2-hardening.tar.gz
          if-no-files-found: warn
      - name: Extract audited source archive
        run: |
          mkdir -p /tmp/pc-powl2-hardening
          tar -xzf /tmp/pc-powl2-hardening.tar.gz -C /tmp/pc-powl2-hardening
          test -s /tmp/pc-powl2-hardening/mod.rs
          test -s /tmp/pc-powl2-hardening/checker.rs
          test -s /tmp/pc-powl2-hardening/broker.rs
          test -s /tmp/pc-powl2-hardening/dfcm.rs
          test -s /tmp/pc-powl2-hardening/tests.rs
      - name: Install audited sources
        run: |
          install -m 0644 /tmp/pc-powl2-hardening/mod.rs wasm4pm/src/pc_powl2/mod.rs
          install -m 0644 /tmp/pc-powl2-hardening/checker.rs wasm4pm/src/pc_powl2/checker.rs
          install -m 0644 /tmp/pc-powl2-hardening/broker.rs wasm4pm/src/pc_powl2/broker.rs
          install -m 0644 /tmp/pc-powl2-hardening/dfcm.rs wasm4pm/src/pc_powl2/dfcm.rs
          install -m 0644 /tmp/pc-powl2-hardening/tests.rs wasm4pm/src/pc_powl2/tests.rs
      - name: Format owned sources only
        run: >-
          rustfmt --edition 2021 --config skip_children=true
          wasm4pm/src/pc_powl2/mod.rs
          wasm4pm/src/pc_powl2/checker.rs
          wasm4pm/src/pc_powl2/broker.rs
          wasm4pm/src/pc_powl2/dfcm.rs
          wasm4pm/src/pc_powl2/tests.rs
      - name: Commit exact audited implementation
        run: |
          git config user.name "pc-powl2-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wasm4pm/src/pc_powl2
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace vacuous PC-POWL2 closure with executable conformance"
          git push origin "HEAD:${HEAD_BRANCH}"
