name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish Workspace Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Workspace
        run: cargo check --workspace

      - name: Publish wasm4pm
        run: |
          echo "Publishing wasm4pm..."
          cargo publish -p wasm4pm --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Propagation Delay (wasm4pm)
        run: sleep 30

      - name: Publish tps-metrics
        run: |
          echo "Publishing tps-metrics..."
          cargo publish -p tps-metrics --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
