name: Workspace Install Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/workspace-install-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Capture frozen install
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee workspace-install.log
      - name: Upload install receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-install-log
          path: workspace-install.log
          if-no-files-found: error
      - name: Refuse failed install
        if: steps.install.outcome != 'success'
        run: exit 1
