name: Finish InterviewAssist TICKET-056

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finish-interviewassist-ticket-056
  cancel-in-progress: false

jobs:
  patch-validate-push:
    if: github.head_ref == 'agent/interviewassist-receipt-chain'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interviewassist-receipt-chain
          fetch-depth: 0

      - name: Patch live client receipt threading
        run: python .github/agent/finish_interviewassist_ticket_056.py

      - name: Create exact candidate commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-finish-interviewassist-ticket-056.yml
          git rm .github/agent/finish_interviewassist_ticket_056.py
          git add examples/interview-assist/app/page.tsx
          git commit -m "wire live InterviewAssist receipt chain"
          git rev-parse HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies and materialize cognition WASM
        run: pnpm install --frozen-lockfile

      - name: Typecheck InterviewAssist
        run: pnpm --dir examples/interview-assist typecheck

      - name: Run route-chain scenario
        run: pnpm --dir examples/interview-assist exec vitest run tests/scenarios/continuous-receipt-route-chain.test.ts

      - name: Install Chromium
        run: pnpm --dir examples/interview-assist exec playwright install --with-deps chromium

      - name: Run live client receipt-chain acceptance
        run: pnpm --dir examples/interview-assist exec playwright test tests/e2e/ticket-056-continuous-receipt-chain.spec.ts --project=chromium

      - name: Push validated commit
        run: git push origin HEAD:agent/interviewassist-receipt-chain
