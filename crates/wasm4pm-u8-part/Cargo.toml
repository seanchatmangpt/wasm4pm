[package]
name = "wasm4pm-u8-part"
version = "26.7.23"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"
description = "Minimal construct-only WASM interchangeable part with one-byte semantic dispatch"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[workspace]

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = "symbols"
