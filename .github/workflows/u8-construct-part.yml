name: u8 construct part

on:
  pull_request:
    paths:
      - "crates/wasm4pm-u8-part/**"
      - "crates/wasm4pm-standing-runtime/**"
      - "scripts/seal_u8_part.py"
      - "scripts/verify_u8_part_wasm.py"
      - ".github/workflows/u8-construct-part.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact subject identity
        run: test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Install pinned Rust toolchain and wasm target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - name: Format bounded courts
        run: |
          cargo fmt --manifest-path crates/wasm4pm-u8-part/Cargo.toml -- --check
          cargo fmt --manifest-path crates/wasm4pm-standing-runtime/Cargo.toml -- --check

      - name: Execute standing algebra geometry and calculus tests
        run: cargo test --manifest-path crates/wasm4pm-standing-runtime/Cargo.toml

      - name: Native exhaustive selector test
        run: cargo test --manifest-path crates/wasm4pm-u8-part/Cargo.toml

      - name: Build exact WASM part
        env:
          RUSTFLAGS: -C strip=symbols
        run: |
          cargo build \
            --manifest-path crates/wasm4pm-u8-part/Cargo.toml \
            --target-dir target/u8-part \
            --release \
            --target wasm32-unknown-unknown

      - name: Erase non-semantic compiler metadata
        run: |
          python3 scripts/seal_u8_part.py \
            target/u8-part/wasm32-unknown-unknown/release/wasm4pm_u8_part.wasm \
            target/u8-part/wasm32-unknown-unknown/release/wasm4pm_u8_part.sealed.wasm

      - name: Verify artifact instruction and string surface
        run: |
          python3 scripts/verify_u8_part_wasm.py \
            target/u8-part/wasm32-unknown-unknown/release/wasm4pm_u8_part.sealed.wasm

      - name: Publish bounded exact-head evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm4pm-u8-part-${{ env.CANDIDATE_SHA }}
          path: target/u8-part/wasm32-unknown-unknown/release/wasm4pm_u8_part.sealed.wasm
          if-no-files-found: error
