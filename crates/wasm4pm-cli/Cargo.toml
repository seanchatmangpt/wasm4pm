[package]
name = "wasm4pm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The official wasm4pm process mining command-line interface"

[[bin]]
name = "wpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "cargo"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = "0.11"
colored = "2.1"
indicatif = "0.17"
wasm4pm = { workspace = true }
wasm4pm-compat = { workspace = true, features = ["formats", "strict", "wasm4pm"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
