name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'apps/wasm4pm/**'
      - 'crates/wasm4pm-cognition/**'
      - 'packages/**'
      - 'wasm4pm/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'examples/**'
      - 'apps/wasm4pm/**'
      - 'crates/wasm4pm-cognition/**'
      - 'packages/**'
      - 'wasm4pm/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install examples dependencies
        run: cd examples && npm install

      - name: Validate all examples
        run: cd examples && npm run validate

  interview-assist-wpm:
    name: Run InterviewAssist CLI directly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install workspace and materialize cognition WASM
        run: pnpm install --frozen-lockfile

      - name: Build wpm runtime dependency closure
        run: pnpm --filter @wasm4pm/cli... build

      - name: Run the built wpm binary
        env:
          WASM4PM_OTEL_ENABLED: 'true'
          WASM4PM_OTEL_ENDPOINT: http://127.0.0.1:9
          WASM4PM_SPANS_FILE: .wasm4pm/spans.jsonl
        run: |
          node apps/wasm4pm/dist/bin/wpm.js \
            lab interview-assist \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/.wasm4pm/interview-assist/latest.json" \
            --timeout-ms 150000 \
            > /tmp/interview-assist-wpm.json
          cat /tmp/interview-assist-wpm.json

      - name: Verify artifacts emitted by the direct CLI run
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const hex64 = /^[0-9a-f]{64}$/;
          const expectedStages = [
            'admission',
            'cognition-run',
            'sandbox-execution',
            'test-result',
            'accessibility-projection',
          ];
          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'));

          const stdout = await readJson('/tmp/interview-assist-wpm.json');
          if (stdout.status !== 'verified' || stdout.receipt_count !== 5) {
            throw new Error(`unexpected wpm stdout: ${JSON.stringify(stdout)}`);
          }

          const evidence = await readJson('.wasm4pm/interview-assist/latest.json');
          if (evidence.status !== 'verified' || evidence.command !== 'wpm lab interview-assist') {
            throw new Error('session evidence did not record a verified direct CLI run');
          }
          const stages = evidence.stages;
          if (!Array.isArray(stages) || stages.length !== expectedStages.length) {
            throw new Error(`expected ${expectedStages.length} stages`);
          }
          const seen = new Set();
          stages.forEach((entry, index) => {
            if (entry.stage !== expectedStages[index]) throw new Error(`wrong stage at ${index}`);
            const receipt = entry.receipt;
            const checksum = receipt?.checksum?.checksumValue;
            if (receipt?.checksum?.algorithm !== 'BLAKE3' || !hex64.test(checksum)) {
              throw new Error(`invalid receipt checksum at ${entry.stage}`);
            }
            if (seen.has(checksum)) throw new Error(`duplicate checksum at ${entry.stage}`);
            seen.add(checksum);
            if (index === 0) {
              if (receipt.derivedFrom !== undefined || receipt.relation !== undefined) {
                throw new Error('chain head unexpectedly has a predecessor');
              }
            } else {
              const predecessor = stages[index - 1].receipt.checksum.checksumValue;
              if (receipt.derivedFrom !== predecessor || receipt.relation !== predecessor) {
                throw new Error(`broken predecessor link at ${entry.stage}`);
              }
            }
          });
          if (evidence.execution?.exit_code !== 0 || evidence.visible_test?.exit_code !== 0) {
            throw new Error('real Python or pytest execution did not exit zero');
          }

          const commandReceipt = await readJson('.wasm4pm/receipts/latest.json');
          if (commandReceipt.command !== 'lab interview-assist' || commandReceipt.status !== 'success') {
            throw new Error('wpm command receipt did not record success');
          }
          if (!hex64.test(commandReceipt.input_hash) || !hex64.test(commandReceipt.output_hash)) {
            throw new Error('wpm command receipt hashes are invalid');
          }

          const spans = (await readFile('.wasm4pm/spans.jsonl', 'utf8'))
            .trim()
            .split('\n')
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const span = spans.find((entry) => entry.name === 'wpm.lab.interview-assist');
          if (!span || span.status?.code !== 'OK') {
            throw new Error('wpm.lab.interview-assist OK span not found');
          }
          NODE
