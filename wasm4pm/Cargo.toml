[features]
# ─────────────────────────────────────────────────────────────────────────────
# CANONICAL FEATURE FLAGS (NEW)
# These are the authoritative semantic features for API stability.
# Internal features (below) map to these canonical names.
# ─────────────────────────────────────────────────────────────────────────────

# Conformance checking (fitness, precision, generalization)
feature-conformance-basic = ["conformance_basic"]
feature-conformance-full = ["conformance_full", "alignment_fitness", "align_etconformance"]

# Discovery algorithms (advanced = genetic, ILP, ACO, PSO)
feature-discovery-advanced = ["discovery_advanced", "genetic", "ilp", "a_star", "aco", "pso", "simulated_annealing"]

# Machine learning (classification, clustering, forecasting, anomaly, regression, PCA)
feature-ml = ["ml", "ml_classify", "ml_cluster", "ml_forecast", "ml_anomaly", "ml_regress", "ml_pca"]

# Object-centric event logs
feature-ocel = ["ocel"]

# Partial-order workflows
feature-powl = ["powl"]

# Streaming algorithms (basic = DFG streaming)
feature-streaming-basic = ["streaming_basic", "streaming_dfg"]

# Streaming algorithms (full = SIMD-accelerated)
feature-streaming-full = ["streaming_full", "streaming_basic", "simd"]

# GPU acceleration (for non-WASM targets)
feature-gpu = ["gpu", "dep:wgpu", "dep:pollster"]

# Hand-rolled statistics (size optimization)
feature-hand-rolled-stats = ["hand_rolled_stats"]

# Full-precision statistics (full statrs library)
feature-statrs = ["statrs", "dep:statrs"]

# Parallel processing (rayon for non-WASM)
feature-rayon = ["rayon", "dep:rayon"]

# Branchless algorithms (bcinr integration)
bcinr = ["dep:bcinr-core"]

# Default: no canonical features (backward compatibility with cloud profile below)
default = ["cloud"]

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT PROFILES
# These combine canonical features into preset configurations.
# Each profile targets a specific deployment target with size constraints.
# ─────────────────────────────────────────────────────────────────────────────

# Browser profile (~500KB): Minimal features for web browsers
# Includes: basic discovery (DFG, skeleton, heuristic), basic conformance, branchless
browser = [
  "feature-conformance-basic",
  "feature-hand-rolled-stats",
  "conformance_basic",
  "bcinr"
]

# IoT profile (~1MB): Minimal features for IoT devices
# Includes: basic discovery, basic conformance, branchless
iot = [
  "feature-conformance-basic",
  "feature-hand-rolled-stats",
  "discovery_basic",
  "conformance_basic",
  "bcinr"
]

# Edge profile (~1.5MB): Advanced algorithms for edge servers (CDN workers)
# Includes: basic + advanced discovery, basic conformance, basic streaming, bcinr
edge = [
  "feature-conformance-basic",
  "feature-discovery-advanced",
  "feature-streaming-basic",
  "feature-hand-rolled-stats",
  "discovery_advanced",
  "conformance_basic",
  "bcinr"
]

# Fog profile (~2MB): Full features except POWL for fog computing
# Includes: all discovery, full conformance, ML, full streaming, OCEL, bcinr
fog = [
  "feature-conformance-full",
  "feature-discovery-advanced",
  "feature-ml",
  "feature-streaming-full",
  "feature-ocel",
  "feature-statrs",
  "discovery_advanced",
  "conformance_full",
  "ml",
  "streaming_full",
  "statrs",
  "ocel",
  "bcinr"
]

# Cloud profile (~2.78MB): Full feature set for cloud servers (DEFAULT)
# Includes: all discovery, full conformance, ML, full streaming, OCEL, POWL, GPU, bcinr
cloud = [
  "feature-conformance-full",
  "feature-discovery-advanced",
  "feature-ml",
  "feature-streaming-full",
  "feature-ocel",
  "feature-powl",
  "feature-statrs",
  "discovery_advanced",
  "conformance_full",
  "ml",
  "streaming_full",
  "petri_net_playout",
  "extensive_playout",
  "montecarlo",
  "statrs",
  "ocel",
  "powl",
  "console_error_panic_hook",
  "bcinr"
]

# Backward compatibility alias
compat = ["cloud"]

# ─────────────────────────────────────────────────────────────────────────────
# INTERNAL FEATURE FLAGS (legacy, kept for compatibility)
# These are used for #[cfg(feature = "...")] module gating in src/*.rs
# ─────────────────────────────────────────────────────────────────────────────

# pm4wasm Feature Tiers
pm4wasm_tier1 = ["discovery_basic", "conformance_basic"]
pm4wasm_tier2 = ["discovery_advanced", "conformance_full"]
pm4wasm_tier3 = ["discovery_advanced", "conformance_full", "ml", "streaming_full", "ocel", "powl"]

# Discovery algorithms
discovery_minimal = []  # DFG only (always included)
discovery_basic = ["alpha_plus_plus", "heuristic_miner", "inductive_miner"]
discovery_advanced = ["discovery_basic", "genetic", "ilp", "a_star", "aco", "pso", "simulated_annealing"]
discovery_swarm = ["discovery_advanced"]

# Individual discovery algorithms (empty features for module-level cfg gating)
alpha_plus_plus = []
heuristic_miner = []
inductive_miner = []
genetic = []
ilp = []
a_star = []
aco = []
pso = []
simulated_annealing = []

# Conformance
conformance_basic = []  # Token replay, temporal profiles
conformance_full = ["conformance_basic", "alignment_fitness", "align_etconformance"]

# ML/Prediction
ml = []
ml_classify = []
ml_cluster = []
ml_forecast = []
ml_anomaly = []
ml_regress = []
ml_pca = []

# Streaming
streaming_basic = ["streaming_dfg"]
streaming_full = ["streaming_basic", "simd"]
streaming_dfg = []
streaming_skeleton = []
streaming_heuristic = []
streaming_inductive = []

# Conformance modules
token_replay = []
alignments = []
diagnostics = []
alignment_fitness = []
petri_net_playout = []
extensive_playout = []
align_etconformance = []
montecarlo = []

# Dependencies
statrs = ["dep:statrs"]
powl = []
ocel = []

# Utility features
hand_rolled_stats = []
simd = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

# GPU acceleration
gpu = []

# Parallel processing
rayon = ["dep:rayon"]

[profile.bench]
opt-level = 3
lto = false
