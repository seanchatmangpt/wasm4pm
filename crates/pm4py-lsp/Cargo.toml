[package]
name = "pm4py-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PM4Py Living LSP bridge using tower-lsp-max"

[dependencies]
tower-lsp-max = { path = "../../../tower-lsp-max" }
tower-lsp-max-protocol = { path = "../../../tower-lsp-max/tower-lsp-max-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
wasm4pm-compat.workspace = true
tracing = "0.1"
regex = "1.10"
uuid.workspace = true
blake3.workspace = true
itertools.workspace = true
pyo3 = { version = "0.21", features = ["auto-initialize"] }

[dev-dependencies]
tempfile.workspace = true
futures = "0.3"
tower = "0.4"
criterion = "0.5"
walkdir = "2.5"

[[bench]]
name = "analysis_bench"
harness = false

[[bench]]
name = "diagnostics_bench"
harness = false

[[bench]]
name = "receipts_bench"
harness = false

[[bench]]
name = "lsp_flow_bench"
harness = false

[lib]
name = "pm4py_lsp"
path = "src/lib.rs"
