name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.release/retry-v26.7.23'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  test:
    name: Verify Publishable Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check all workspace crates
        run: cargo check --workspace --all-targets

  publish:
    name: Publish Workspace Crates
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm4pm") | .version')
          test -n "$version"
          echo "Publishing workspace version $version"

          crate_exists() {
            local crate="$1"
            curl --fail --silent --show-error --retry 3 \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          wait_until_visible() {
            local crate="$1"
            for attempt in $(seq 1 30); do
              if crate_exists "$crate"; then
                echo "Registry receipt: ${crate}@${version} is visible"
                return 0
              fi
              echo "Waiting for crates.io propagation: ${crate}@${version} (${attempt}/30)"
              sleep 10
            done
            echo "::error::${crate}@${version} did not become visible on crates.io"
            return 1
          }

          publish_one() {
            local package="$1"
            local crate="$2"
            if crate_exists "$crate"; then
              echo "Already published: ${crate}@${version}"
            else
              cargo publish -p "$package" --locked
            fi
            wait_until_visible "$crate"
          }

          # Registry dependency topology:
          # prolog8 -> wasm4pm-cognition -> wasm4pm
          # miniml ----------------------> wasm4pm
          publish_one prolog8 prolog8
          publish_one miniml miniml
          publish_one wasm4pm-cognition wasm4pm-cognition
          publish_one wasm4pm wasm4pm
          publish_one tps-metrics tps-metrics
