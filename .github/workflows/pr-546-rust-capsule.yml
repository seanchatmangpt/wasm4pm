name: PR 546 Exact-Head Rust Capsule

on:
  push:
    branches: ["agent/cloud-toolchain-capsules-20260804"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-capsule:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact branch head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Manufacture relocatable Rust capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capsule/root/.cargo out replay
          cp -a "$HOME/.rustup" capsule/root/.rustup
          cp -a "$HOME/.cargo/bin" capsule/root/.cargo/bin
          cat > capsule/activate.sh <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/root"
          export RUSTUP_HOME="$ROOT/.rustup"
          export CARGO_HOME="$ROOT/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          export RUSTUP_TOOLCHAIN=nightly-2026-04-15-x86_64-unknown-linux-gnu
          EOF
          chmod +x capsule/activate.sh
          source capsule/activate.sh
          rustc --version --verbose | tee capsule/RUSTC_VERSION
          cargo --version | tee capsule/CARGO_VERSION
          rustfmt --version | tee capsule/RUSTFMT_VERSION
          cargo clippy --version | tee capsule/CLIPPY_VERSION
          rustup target list --installed | grep -Fx wasm32-unknown-unknown | tee capsule/TARGETS
          printf 'fn main(){println!("RUST_CAPSULE_ALIVE:{}",19+23);}\n' > /tmp/alive.rs
          rustc /tmp/alive.rs -o /tmp/alive
          test "$(/tmp/alive)" = "RUST_CAPSULE_ALIVE:42"
          python3 - <<'PY' > capsule/RECEIPT.json
          import json, os, platform
          print(json.dumps({
              "schema": "chatman-toolchain-capsule-receipt/v1",
              "repository": "seanchatmangpt/wasm4pm",
              "pull_request": 546,
              "head": os.environ["GITHUB_SHA"],
              "architecture": platform.machine(),
              "toolchain": "nightly-2026-04-15-x86_64-unknown-linux-gnu",
              "standing": "ALIVE"
          }, indent=2, sort_keys=True))
          PY
          tar --zstd -cf out/rust-nightly-2026-04-15-x86_64-linux.tar.zst capsule
          sha256sum out/rust-nightly-2026-04-15-x86_64-linux.tar.zst > out/SHA256SUMS
          mkdir -p replay
          tar --zstd -xf out/rust-nightly-2026-04-15-x86_64-linux.tar.zst -C replay
          source replay/capsule/activate.sh
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          test "$(rustup target list --installed | grep -Fx wasm32-unknown-unknown)" = "wasm32-unknown-unknown"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-546-rust-nightly-2026-04-15
          path: out/
          compression-level: 0
          if-no-files-found: error
