name: pnpm Install Gate

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - 'crates/wasm4pm-cognition/**'
      - 'scripts/bootstrap-cognition-wasm.sh'
      - '.github/workflows/pnpm-install.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - 'crates/wasm4pm-cognition/**'
      - 'scripts/bootstrap-cognition-wasm.sh'
      - '.github/workflows/pnpm-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Frozen workspace install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Bootstrap cognition WASM packages
        shell: bash
        run: |
          set -o pipefail
          bash scripts/bootstrap-cognition-wasm.sh 2>&1 | tee cognition-bootstrap.log

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee pnpm-install.log

      - name: Upload install receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-receipt
          path: |
            cognition-bootstrap.log
            pnpm-install.log
          if-no-files-found: error
          retention-days: 7
