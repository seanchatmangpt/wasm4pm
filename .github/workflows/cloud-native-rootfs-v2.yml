name: Cloud Native RootFS V2

on:
  push:
    branches:
      - agent/cloud-toolchain-capsules-20260804
    paths:
      - .github/workflows/cloud-native-rootfs-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rootfs:
    name: Native tools with preserved Ubuntu runtime closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Build self-contained execution image
        shell: bash
        run: |
          set -euo pipefail
          cat > Dockerfile <<'DOCKERFILE'
          FROM ubuntu:24.04 AS souffle-builder
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates git cmake ninja-build build-essential flex bison \
              libsqlite3-dev libffi-dev libncurses-dev zlib1g-dev \
              mcpp libmcpp-dev libomp-dev \
            && rm -rf /var/lib/apt/lists/*
          RUN git clone --depth 1 --branch 2.5 https://github.com/souffle-lang/souffle.git /src \
              || git clone --depth 1 https://github.com/souffle-lang/souffle.git /src
          RUN cmake -S /src -B /src/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DSOUFFLE_USE_CURSES=OFF \
              && cmake --build /src/build --parallel 2 \
              && DESTDIR=/souffle-root cmake --install /src/build

          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              bash coreutils findutils grep sed gawk file jq ca-certificates \
              z3 cvc5 openssh-client podman buildah skopeo gh \
              docker.io containerd runc uidmap fuse-overlayfs slirp4netns \
              libsqlite3-0 libffi8 libncurses6 zlib1g libomp5 \
            && rm -rf /var/lib/apt/lists/* /var/cache/apt/*
          COPY --from=souffle-builder /souffle-root/ /

          RUN set -euo pipefail; \
              gh --version | head -n 1; \
              ssh -V; \
              ssh-keygen -q -t ed25519 -N '' -f /tmp/native-key; \
              z3 --version; \
              cvc5 --version | head -n 1; \
              souffle --version; \
              podman --version; \
              buildah --version; \
              skopeo --version; \
              docker --version; \
              dockerd --version; \
              containerd --version; \
              runc --version | head -n 1

          RUN cat >/tmp/alive.smt2 <<'EOF'
          (set-logic QF_LIA)
          (declare-const x Int)
          (assert (= x 42))
          (check-sat)
          EOF
          RUN test "$(z3 /tmp/alive.smt2 | tail -n 1)" = sat \
              && test "$(cvc5 /tmp/alive.smt2 | tail -n 1)" = sat

          RUN cat >/tmp/alive.dl <<'EOF'
          .decl edge(x:number,y:number)
          .decl path(x:number,y:number)
          .output path
          edge(1,2).
          edge(2,3).
          path(x,y) :- edge(x,y).
          path(x,z) :- path(x,y), edge(y,z).
          EOF
          RUN mkdir -p /tmp/souffle-out \
              && souffle -D /tmp/souffle-out /tmp/alive.dl \
              && grep -F $'1\t3' /tmp/souffle-out/path.csv

          RUN cat >/usr/local/bin/verify-native-surface <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          gh --version | head -n 1
          ssh -V
          rm -f /tmp/replay-key /tmp/replay-key.pub
          ssh-keygen -q -t ed25519 -N '' -f /tmp/replay-key
          z3 --version
          cvc5 --version | head -n 1
          souffle --version
          podman --version
          buildah --version
          skopeo --version
          docker --version
          dockerd --version
          containerd --version
          runc --version | head -n 1
          test "$(z3 /tmp/alive.smt2 | tail -n 1)" = sat
          test "$(cvc5 /tmp/alive.smt2 | tail -n 1)" = sat
          rm -rf /tmp/souffle-replay && mkdir /tmp/souffle-replay
          souffle -D /tmp/souffle-replay /tmp/alive.dl
          grep -F $'1\t3' /tmp/souffle-replay/path.csv
          echo NATIVE_ROOTFS_ALIVE
          EOF
          RUN chmod +x /usr/local/bin/verify-native-surface \
              && /usr/local/bin/verify-native-surface
          DOCKERFILE

          docker build --progress=plain -t chatman-native-rootfs:v2 .
          docker run --rm chatman-native-rootfs:v2 /usr/local/bin/verify-native-surface | tee /tmp/producer-replay.log

      - name: Export, split, reconstruct, and replay rootfs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capsule/out capsule/reconstructed capsule/rootfs
          cid="$(docker create chatman-native-rootfs:v2)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -19 -T0 -o capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst
          split -b 240MiB -d -a 2 \
            capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst \
            capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-
          rm capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst
          (
            cd capsule/out
            sha256sum native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-* > SHA256SUMS.parts
          )
          cp /tmp/producer-replay.log capsule/out/PRODUCER_REPLAY.log
          cat > capsule/out/RECONSTRUCT.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          sha256sum -c SHA256SUMS.parts
          cat native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-* > native-tools-ubuntu24-x86_64-rootfs.tar.zst
          EOF
          chmod +x capsule/out/RECONSTRUCT.sh

          capsule/out/RECONSTRUCT.sh
          zstd -dc capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst | tar -xf - -C capsule/rootfs
          chroot capsule/rootfs /usr/local/bin/verify-native-surface | tee capsule/out/ROOTFS_REPLAY.log
          sha256sum capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst > capsule/out/ROOTFS_SHA256
          rm capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst

      - name: Upload rootfs metadata
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-rootfs-v2-metadata
          path: |
            capsule/out/SHA256SUMS.parts
            capsule/out/ROOTFS_SHA256
            capsule/out/RECONSTRUCT.sh
            capsule/out/PRODUCER_REPLAY.log
            capsule/out/ROOTFS_REPLAY.log
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload rootfs part 00
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-rootfs-v2-part-00
          path: capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-00
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload rootfs part 01
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-rootfs-v2-part-01
          path: capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-01
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload rootfs part 02
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-rootfs-v2-part-02
          path: capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-02
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload rootfs part 03
        uses: actions/upload-artifact@v4
        with:
          name: cloud-native-rootfs-v2-part-03
          path: capsule/out/native-tools-ubuntu24-x86_64-rootfs.tar.zst.part-03
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
