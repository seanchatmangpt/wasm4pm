name: Export InterviewAssist TICKET-056 page

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: export-interviewassist-ticket-056
  cancel-in-progress: true

jobs:
  export-page:
    if: github.head_ref == 'agent/interviewassist-receipt-chain'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interviewassist-receipt-chain

      - name: Patch live client receipt threading
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/finish_interviewassist_ticket_056.py')
          text = path.read_text()
          old_argument = '    "  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the real",'
          new_argument = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }""",'''
          old_replacement = '    """  async function changeAccessibilityPreference('
          new_replacement = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }

            async function changeAccessibilityPreference('''
          if text.count(old_argument) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('temporary patch script drifted before anchor repair')
          text = text.replace(old_argument, new_argument, 1)
          text = text.replace(old_replacement, new_replacement, 1)
          path.write_text(text)
          PY
          python .github/agent/finish_interviewassist_ticket_056.py

      - name: Export exact patched page
        uses: actions/upload-artifact@v4
        with:
          name: ticket-056-patched-page
          path: examples/interview-assist/app/page.tsx
          if-no-files-found: error
