name: Open Ontologies Dependency Head

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: open-ontologies-dependency-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/windows-portable-tree-057d5'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out immutable dependency head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove exact candidate identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - name: Verify Open Ontologies dependency feature graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p wasm4pm --no-default-features --features 'powl,ocel,conformance_basic,hand_rolled_stats,streaming_basic,discovery_advanced,ml'
          cargo test --locked -p wasm4pm-cognition --lib
