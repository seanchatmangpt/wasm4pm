[package]
name = "pictl-algos"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-performance, branchless algorithm implementations for pictl process mining"
repository = "https://github.com/seanchatmangpt/pictl"

[dependencies]
pictl-types = { path = "../pictl-types" }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.105"
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
itertools = "0.14.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
