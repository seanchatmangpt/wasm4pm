name: scikit-decide Interop

on:
  pull_request:
    paths:
      - "interop/scikit-decide/**"
      - ".github/workflows/scikit-decide-interop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scikit-decide-interop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-owned-core-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Observe execution substrate
        run: |
          set -euo pipefail
          python3 --version
          clang --version | head -1
          node --version
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Manufacture and execute the exact adapter
        run: |
          set -euo pipefail
          python3 interop/scikit-decide/verify.py \
            --source-revision "$SOURCE_REVISION" \
            --output build/scikit-decide-interop

      - name: Recompute and inspect receipt identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/scikit-decide-interop")
          receipt = json.loads((root / "interop-receipt.json").read_text())
          artifact = root / receipt["artifact"]["filename"]
          observed = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert receipt["status"] == "ALIVE"
          assert receipt["subject"] == {
              "component": "wasm4pm",
              "source_revision": os.environ["SOURCE_REVISION"],
          }
          assert observed == receipt["artifact"]["sha256"]
          assert receipt["artifact"]["imports"] == []
          assert receipt["artifact"]["memory"] == {
              "flags": 1,
              "minimum_pages": 3,
              "maximum_pages": 3,
          }
          assert receipt["standing"]["actuation"] == "REFUSED:ACTUATION_NOT_ADMITTED"
          assert receipt["execution"]["replay"]["exact_response_bytes_equal"] is True
          print(json.dumps({
              "status": "ALIVE",
              "source_revision": os.environ["SOURCE_REVISION"],
              "artifact_sha256": observed,
              "cases": len(receipt["execution"]["cases"]),
          }, sort_keys=True))
          PY
