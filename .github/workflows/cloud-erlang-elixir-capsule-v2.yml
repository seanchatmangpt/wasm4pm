name: Cloud Erlang Elixir Capsule V2

on:
  push:
    branches:
      - agent/cloud-toolchain-capsules-20260804
    paths:
      - .github/workflows/cloud-erlang-elixir-capsule-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  erlang-elixir:
    name: Preserve Erlang and Elixir installation topology
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install complete BEAM command surface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            erlang-base erlang-dev erlang-tools erlang-dialyzer \
            erlang-crypto erlang-ssl erlang-inets elixir libsctp1
          for b in erl erlc escript dialyzer elixir elixirc iex mix; do
            command -v "$b"
          done

      - name: Manufacture topology-preserving BEAM capsule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capsule/payload/root/usr/lib capsule/payload/root/usr/bin \
            capsule/payload/root/lib capsule/payload/root/lib64 capsule/out capsule/replay
          cp -a /usr/lib/erlang capsule/payload/root/usr/lib/
          cp -a /usr/lib/elixir capsule/payload/root/usr/lib/

          # Preserve relative launcher symlinks. Dereferencing these symlinks moves
          # the scripts away from their adjacent lib directories and breaks Elixir.
          for b in erl erlc escript dialyzer elixir elixirc iex mix; do
            p="$(command -v "$b")"
            cp -a "$p" "capsule/payload/root/usr/bin/$b"
          done

          copy_deps() {
            local p="$1"
            while IFS= read -r lib; do
              [ -n "$lib" ] || continue
              cp -aL --parents "$lib" capsule/payload/root
            done < <((ldd "$p" 2>/dev/null || true) | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | sort -u)
          }
          while IFS= read -r elf; do copy_deps "$elf"; done < <(
            find /usr/lib/erlang -type f -exec file {} + | awk -F: '/ELF 64-bit/ {print $1}'
          )
          if [ -e /lib64/ld-linux-x86-64.so.2 ]; then
            cp -aL --parents /lib64/ld-linux-x86-64.so.2 capsule/payload/root
          fi

          cat > capsule/payload/activate.sh <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/root"
          export ERL_ROOTDIR="$ROOT/usr/lib/erlang"
          export LD_LIBRARY_PATH="$ROOT/lib/x86_64-linux-gnu:$ROOT/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export PATH="$ROOT/usr/bin:$ROOT/usr/lib/erlang/bin:$ROOT/usr/lib/elixir/bin:$PATH"
          EOF
          chmod +x capsule/payload/activate.sh

          source capsule/payload/activate.sh
          erl -noshell -eval '42 = 19 + 23, io:format("ERLANG_CAPSULE_ALIVE:42~n"), halt().' | tee capsule/payload/ERLANG_SMOKE
          elixir -e '42 = 19 + 23; IO.puts("ELIXIR_CAPSULE_ALIVE:42")' | tee capsule/payload/ELIXIR_SMOKE
          mix --version | tee capsule/payload/MIX_VERSION
          dialyzer --version | tee capsule/payload/DIALYZER_VERSION

          tar --zstd -cf capsule/out/erlang-elixir-x86_64-linux.tar.zst -C capsule payload
          (cd capsule/out && sha256sum erlang-elixir-x86_64-linux.tar.zst > SHA256SUMS)
          tar --zstd -xf capsule/out/erlang-elixir-x86_64-linux.tar.zst -C capsule/replay

          ROOT="$PWD/capsule/replay/payload/root"
          env -i \
            HOME=/tmp \
            ERL_ROOTDIR="$ROOT/usr/lib/erlang" \
            LD_LIBRARY_PATH="$ROOT/lib/x86_64-linux-gnu:$ROOT/usr/lib/x86_64-linux-gnu" \
            PATH="$ROOT/usr/bin:$ROOT/usr/lib/erlang/bin:$ROOT/usr/lib/elixir/bin:/usr/bin:/bin" \
            erl -noshell -eval '42 = 19 + 23, io:format("ERLANG_REPLAY_ALIVE:42~n"), halt().'
          env -i \
            HOME=/tmp \
            ERL_ROOTDIR="$ROOT/usr/lib/erlang" \
            LD_LIBRARY_PATH="$ROOT/lib/x86_64-linux-gnu:$ROOT/usr/lib/x86_64-linux-gnu" \
            PATH="$ROOT/usr/bin:$ROOT/usr/lib/erlang/bin:$ROOT/usr/lib/elixir/bin:/usr/bin:/bin" \
            elixir -e '42 = 19 + 23; IO.puts("ELIXIR_REPLAY_ALIVE:42")'
          env -i \
            HOME=/tmp \
            ERL_ROOTDIR="$ROOT/usr/lib/erlang" \
            LD_LIBRARY_PATH="$ROOT/lib/x86_64-linux-gnu:$ROOT/usr/lib/x86_64-linux-gnu" \
            PATH="$ROOT/usr/bin:$ROOT/usr/lib/erlang/bin:$ROOT/usr/lib/elixir/bin:/usr/bin:/bin" \
            mix --version
          env -i \
            HOME=/tmp \
            ERL_ROOTDIR="$ROOT/usr/lib/erlang" \
            LD_LIBRARY_PATH="$ROOT/lib/x86_64-linux-gnu:$ROOT/usr/lib/x86_64-linux-gnu" \
            PATH="$ROOT/usr/bin:$ROOT/usr/lib/erlang/bin:$ROOT/usr/lib/elixir/bin:/usr/bin:/bin" \
            dialyzer --version

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-erlang-elixir-topology-v2
          path: capsule/out/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
