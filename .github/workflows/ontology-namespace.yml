name: Ontology namespace policy

on:
  pull_request:
    paths:
      - "ontology/**"
      - "ggen/ontology/**"
      - "ggen/ontology-*/**"
      - "packs/**/ggen/ontology/**"
      - "packs/**/ggen/queries/**"
      - "semconv/sparql-proofs/**"
      - "lifecycle/**"
      - "ocel/reports/**"
      - "ggen.toml"
      - "scripts/verify-ontology-namespaces.py"
      - "scripts/tests/test_verify_ontology_namespaces.py"
      - ".github/workflows/ontology-namespace.yml"
  push:
    branches: [main]
    paths:
      - "ontology/**"
      - "ggen/ontology/**"
      - "ggen/ontology-*/**"
      - "packs/**/ggen/ontology/**"
      - "packs/**/ggen/queries/**"
      - "semconv/sparql-proofs/**"
      - "lifecycle/**"
      - "ocel/reports/**"
      - "ggen.toml"
      - "scripts/verify-ontology-namespaces.py"
      - "scripts/tests/test_verify_ontology_namespaces.py"

permissions:
  contents: read

jobs:
  namespace-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run namespace classifier regression tests
        run: python3 -m unittest scripts/tests/test_verify_ontology_namespaces.py -v

      - name: Verify namespace registry and semantic sources
        run: python3 scripts/verify-ontology-namespaces.py --json

      - name: Validate JSON-LD context syntax
        run: python3 -m json.tool ontology/chatmangpt/context.jsonld >/dev/null

      - name: Validate namespace registry syntax
        run: python3 -m json.tool ontology/chatmangpt/namespaces.json >/dev/null

      - name: Install RDF validators
        run: python3 -m pip install --disable-pip-version-check rdflib pyshacl

      - name: Parse canonical Turtle and SHACL graphs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from rdflib import Graph

          files = [
              Path("ontology/chatmangpt/wasm4pm-namespace.ttl"),
              Path("ontology/chatmangpt/wasm4pm-shapes.ttl"),
          ]
          for path in files:
              graph = Graph()
              graph.parse(path, format="turtle")
              if len(graph) == 0:
                  raise SystemExit(f"RDF_GRAPH_EMPTY: {path}")
              print(f"parsed {path}: {len(graph)} triples")
          PY

      - name: Validate SHACL shape graph
        run: |
          pyshacl \
            -s ontology/chatmangpt/wasm4pm-shapes.ttl \
            -m \
            -f human \
            ontology/chatmangpt/wasm4pm-namespace.ttl
