name: npm Install Smoke Test

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'wasm4pm/**'
      - 'packages/ml/**'
      - 'packages/cognition/**'
      - 'crates/wasm4pm-cognition/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/bootstrap-cognition-wasm.sh'
      - 'scripts/npm-install-smoke.sh'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+simd128"

jobs:
  smoke-test:
    name: Standalone npm Install Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install, and execute published packages
        shell: bash
        run: bash scripts/npm-install-smoke.sh
