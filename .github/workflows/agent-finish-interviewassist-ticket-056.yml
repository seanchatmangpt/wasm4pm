name: Apply InterviewAssist TICKET-056 page

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-interviewassist-ticket-056
  cancel-in-progress: true

jobs:
  apply-page:
    if: github.head_ref == 'agent/interviewassist-receipt-chain'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interviewassist-receipt-chain
          fetch-depth: 0

      - name: Apply and commit guarded page patch
        shell: bash
        run: |
          set -euo pipefail
          report_failure() {
            status=$?
            gh pr comment "$PR_NUMBER" --repo seanchatmangpt/wasm4pm \
              --body "TICKET-056 page applier refused with exit status ${status} on source commit ${GITHUB_SHA}. No page commit was pushed."
            exit "$status"
          }
          trap report_failure ERR

          page=examples/interview-assist/app/page.tsx
          if grep -q 'const ADMISSION_TIMEOUT_MS = 10_000;' "$page"; then
            gh pr comment "$PR_NUMBER" --repo seanchatmangpt/wasm4pm \
              --body "TICKET-056 page wiring is already present at ${GITHUB_SHA}; no additional page commit was required."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/agent/finish_interviewassist_ticket_056.py')
          text = helper.read_text()
          old_argument = '    "  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the real",'
          new_argument = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }""",'''
          old_replacement = '    """  async function changeAccessibilityPreference('
          new_replacement = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }

            async function changeAccessibilityPreference('''
          if text.count(old_argument) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('temporary patch helper drifted')
          helper.write_text(text.replace(old_argument, new_argument, 1).replace(old_replacement, new_replacement, 1))
          PY

          python .github/agent/finish_interviewassist_ticket_056.py

          python - <<'PY'
          from pathlib import Path
          page = Path('examples/interview-assist/app/page.tsx')
          text = page.read_text()
          old = '''  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the real

  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the
   * real checksum-adapter'''
          new = '''  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the
   * real checksum-adapter'''
          if text.count(old) != 1:
              raise SystemExit('expected one duplicate comment anchor after guarded patch')
          page.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$page"
          git commit -m 'wire live InterviewAssist receipt chain'
          candidate=$(git rev-parse HEAD)
          gh pr comment "$PR_NUMBER" --repo seanchatmangpt/wasm4pm \
            --body "TICKET-056 guarded page patch produced candidate commit ${candidate}; pushing it to the PR branch now."
          git push origin HEAD:agent/interviewassist-receipt-chain
