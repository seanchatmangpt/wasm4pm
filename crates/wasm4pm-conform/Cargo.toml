[package]
name = "wasm4pm-conform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High-assurance, trajectory-based IEEE OCEL 2.0 conformance checking engine for the wasm4pm ecosystem"

[dependencies]
bcinr-powl = { workspace = true }
bcinr-cmca = { workspace = true }
wasm4pm-compat = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
thiserror = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }

