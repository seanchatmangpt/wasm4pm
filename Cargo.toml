[workspace]
resolver = "2"

members = ["wasm4pm", "tps-metrics", "crates/wasm4pm-cli", "crates/miniml-core", "crates/wasm4pm-cognition", "crates/prolog8", "crates/ocpq", "crates/bench-tools"]
# wasm4pm-lsp depends on an out-of-repo path crate `lsp-max` (../../../lsp-max) that is
# not part of this repository and cannot be resolved in a clean checkout. Excluded so the
# rest of the workspace builds reproducibly. Re-add to `members` once lsp-max is vendored
# or published.
exclude = ["crates/wasm4pm-lsp"]

[workspace.package]
version = "26.6.12"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde", "js"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
itertools = "0.15.0"
rustc-hash = "2"
blake3 = "1.5"
tracing = { version = "0.1", default-features = false }
sha2 = "0.10.8"
bcinr = { version = "26.4.22" }
wasm4pm-compat = { version = "26.6.10", features = ["formats", "strict", "wasm4pm"] }
wasm4pm = { version = "26.6.10", path = "wasm4pm", features = ["cloud"] }
wasm4pm-cognition = { version = "26.6.10", path = "crates/wasm4pm-cognition" }
prolog8 = { version = "26.6.10", path = "crates/prolog8" }
miniml = { version = "26.6.10", path = "crates/miniml-core" }
ocpq = { version = "26.6.10", path = "crates/ocpq" }
fake = "2.9"
proptest = "1.4"
tempfile = "3.8"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = false

[patch.crates-io]
wasm4pm = { path = "wasm4pm" }
