name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies (workspace install covers wasm4pm)
        run: pnpm install

      - name: Build WASM
        run: cd wasm4pm && npm run build:all

      - name: Build TypeScript packages
        run: pnpm -r --parallel build

      - name: Run tests
        run: cd wasm4pm && npm run test:unit

      - name: Remove wasm-pack generated pkg/.gitignore
        run: rm -f wasm4pm/pkg/.gitignore

      - name: Clean-environment container test
        run: node lab/scripts/test-container.mjs

      - name: Publish to npm
        run: cd wasm4pm && npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
