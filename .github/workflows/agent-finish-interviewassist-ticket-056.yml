name: Finish InterviewAssist TICKET-056

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finish-interviewassist-ticket-056
  cancel-in-progress: false

jobs:
  patch-validate-push:
    if: github.head_ref == 'agent/interviewassist-receipt-chain'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interviewassist-receipt-chain
          fetch-depth: 0

      - name: Patch live client receipt threading
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/finish_interviewassist_ticket_056.py')
          text = path.read_text()
          old_argument = '    "  /** Real end-to-end receipt: POSTs to app/api/receipt, which calls the real",'
          new_argument = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }""",'''
          old_replacement = '    """  async function changeAccessibilityPreference('
          new_replacement = '''    """  function rejectCognitionProposal(): void {
              setCognitionIntent(null);
              setCognitionOutcome(null);
            }

            async function changeAccessibilityPreference('''
          if text.count(old_argument) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('temporary patch script drifted before anchor repair')
          text = text.replace(old_argument, new_argument, 1)
          text = text.replace(old_replacement, new_replacement, 1)
          path.write_text(text)
          PY
          python .github/agent/finish_interviewassist_ticket_056.py 2>&1 | tee /tmp/patch.log

      - name: Create exact candidate commit
        shell: bash
        run: |
          set -o pipefail
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/agent-finish-interviewassist-ticket-056.yml
            git rm -f .github/agent/finish_interviewassist_ticket_056.py
            git add examples/interview-assist/app/page.tsx
            git status --short
            git commit -m "wire live InterviewAssist receipt chain"
            git rev-parse HEAD
          } 2>&1 | tee /tmp/candidate.log

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies and materialize cognition WASM
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log

      - name: Typecheck InterviewAssist
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir examples/interview-assist typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Run route-chain scenario
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir examples/interview-assist exec vitest run tests/scenarios/continuous-receipt-route-chain.test.ts 2>&1 | tee /tmp/vitest.log

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir examples/interview-assist exec playwright install --with-deps chromium 2>&1 | tee /tmp/chromium-install.log

      - name: Run live client receipt-chain acceptance
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir examples/interview-assist exec playwright test tests/e2e/ticket-056-continuous-receipt-chain.spec.ts --project=chromium 2>&1 | tee /tmp/playwright.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-056-validation-evidence
          path: |
            /tmp/patch.log
            /tmp/candidate.log
            /tmp/install.log
            /tmp/typecheck.log
            /tmp/vitest.log
            /tmp/chromium-install.log
            /tmp/playwright.log
          if-no-files-found: warn

      - name: Push validated commit
        run: git push origin HEAD:agent/interviewassist-receipt-chain
