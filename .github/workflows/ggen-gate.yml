name: ggen Conformance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GGEN_REV: b82ea9ef848a5164dd6a09bb76539908fde41922
  COMPAT_REV: 577e2d1d8bdfe27d96f61c63f3ea120994e8bfda
  RUST_TOOLCHAIN: nightly-2026-08-04

jobs:
  evidence-check:
    name: Project evidence freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify evidence.ttl is fresh vs ocel/reports/*.json
        run: |
          set -euo pipefail
          python3 scripts/project_evidence.py
          git diff --exit-code -- ocel/reports/evidence.ttl \
            || { echo "::error::ocel/reports/evidence.ttl is stale — regenerate via 'python3 scripts/project_evidence.py'"; exit 1; }

  ggen-sync:
    name: ggen sync conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Public deterministic CI identity. This validates signing and verification
    # plumbing only; it is not a production or release signing key.
    env:
      GGEN_SIGNING_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    steps:
      - uses: actions/checkout@v4
        with:
          path: wasm4pm

      - uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/wasm4pm-compat
          ref: ${{ env.COMPAT_REV }}
          path: wasm4pm-compat

      - uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.GGEN_REV }}
          path: ggen

      - name: Setup pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache pinned ggen build
        uses: actions/cache@v6
        with:
          path: ggen/target
          key: ggen-source-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.GGEN_REV }}-${{ hashFiles('ggen/Cargo.lock') }}

      - name: Build pinned ggen
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path ggen/crates/ggen-cli/Cargo.toml \
            --bin ggen \
            --locked 2>&1 | tee ggen-build.log

      - name: Run ggen sync
        working-directory: wasm4pm
        shell: bash
        run: |
          set -euo pipefail
          ../ggen/target/debug/ggen sync run 2>&1 | tee ../ggen-sync.log

      - name: Assert rendered sources unchanged
        working-directory: wasm4pm
        shell: bash
        run: |
          set -euo pipefail
          # Receipts are run evidence. The committed source projections must
          # remain byte-identical to a clean sync from the pinned ontology pack.
          git diff --exit-code -- ':!.ggen/receipts' ':!.ggen-v2' \
            || { echo "::error::ggen sync produced source drift — regenerate from the pinned ontology pack"; exit 1; }

      - name: Verify fresh signed receipt
        working-directory: wasm4pm
        shell: bash
        run: |
          set -euo pipefail
          ../ggen/target/debug/ggen receipt verify \
            | tee ../ggen-receipt-verify.json

      - name: Verify receipt outputs against disk
        working-directory: wasm4pm
        shell: bash
        run: |
          set -euo pipefail
          ../ggen/target/debug/ggen doctor run \
            | tee ../ggen-doctor.json

      - name: Upload ggen conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggen-conformance-evidence
          path: |
            ggen-build.log
            ggen-sync.log
            ggen-receipt-verify.json
            ggen-doctor.json
            wasm4pm/.ggen-v2/receipt.json
            wasm4pm/.ggen-v2/receipt-log.jsonl
          if-no-files-found: warn
          retention-days: 7
