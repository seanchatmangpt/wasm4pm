name: PC-POWL2 Hardening and 8^4 Conformance

on:
  pull_request:
    branches:
      - main
      - agent/pc-powl2-engine
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "wasm4pm/src/pc_powl2/**"
      - ".github/workflows/pc-powl2-8pow4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-powl2-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bind-wire-revision:
    name: Bind exact verified compat revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-powl2-8pow4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy
      - name: Pin exact green compat revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          source = path.read_text()
          old = '''# Stacked PR dependency. Replace with the released compat version after
          # seanchatmangpt/wasm4pm-compat#agent/pc-powl2-wire is merged and published.
          wasm4pm-compat = { git = "https://github.com/seanchatmangpt/wasm4pm-compat", branch = "agent/pc-powl2-wire", features = ["formats", "strict", "wasm4pm"] }
          '''
          new = '''# Exact green wire revision. Replace with the released compat version only
          # after the human-controlled crates.io publication receipt exists.
          wasm4pm-compat = { git = "https://github.com/seanchatmangpt/wasm4pm-compat", rev = "c3edd4c25663f5ef6a552abb2a1b9e8d23ac4d5b", features = ["formats", "strict", "wasm4pm"] }
          '''
          if source.count(old) != 1:
              raise SystemExit("compat dependency context mismatch")
          path.write_text(source.replace(old, new))
          PY
          cargo update -p wasm4pm-compat
          python3 - <<'PY'
          from pathlib import Path
          lock = Path("Cargo.lock").read_text()
          blocks = lock.split("[[package]]")
          matches = [b for b in blocks if '\nname = "wasm4pm-compat"\n' in b]
          if len(matches) != 1:
              raise SystemExit(f"expected one wasm4pm-compat lock block, found {len(matches)}")
          block = matches[0]
          expected = "c3edd4c25663f5ef6a552abb2a1b9e8d23ac4d5b"
          if expected not in block or 'source = "git+' not in block:
              raise SystemExit("Cargo.lock is not bound to the exact compat revision")
          PY
          git diff --check -- Cargo.toml Cargo.lock
      - name: Verify exact dependency binding
        run: cargo test -p wasm4pm --lib pc_powl2
      - name: Refuse warnings after dependency binding
        run: cargo clippy -p wasm4pm --lib -- -D warnings
      - name: Commit manifest and lock receipt
        run: |
          git config user.name "pc-powl2-receipt-broker"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Pin verified PC-POWL2 wire revision"
          git push origin HEAD:agent/pc-powl2-8pow4
