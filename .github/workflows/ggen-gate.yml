name: ggen Conformance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GGEN_REV: 555f857ac5dcf236eba0121d0833bb764a782e3a
  COMPAT_REV: 9bffd6625b7e55ea2b5e25d3370fc33b797e6745

jobs:
  # Verifies the latest ggen receipt without needing the ggen binary:
  # every file listed in .ggen/receipts/latest.json output_hashes must
  # hash (sha256) to the recorded value on disk.
  receipt-check:
    name: Receipt hash verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify output_hashes in .ggen/receipts/latest.json
        run: |
          set -euo pipefail
          receipt=.ggen/receipts/latest.json
          test -f "$receipt" || { echo "::error::$receipt missing"; exit 1; }
          fail=0
          while IFS= read -r entry; do
            file="${entry%:*}"
            expected="${entry##*:}"
            if [ ! -f "$file" ]; then
              echo "::error::receipt references missing file: $file"
              fail=1
              continue
            fi
            actual=$(shasum -a 256 "$file" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::hash mismatch for $file (expected $expected, got $actual)"
              fail=1
            else
              echo "ok: $file"
            fi
          done < <(jq -r '.output_hashes[]? // empty' "$receipt")
          exit $fail

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify evidence.ttl is fresh vs ocel/reports/*.json
        run: |
          set -euo pipefail
          python3 scripts/project_evidence.py
          git diff --exit-code -- ocel/reports/evidence.ttl \
            || { echo "::error::ocel/reports/evidence.ttl is stale — regenerate via 'python3 scripts/project_evidence.py'"; exit 1; }

  # Full sync conformance: build the exact ggen source revision, run `ggen sync`
  # against the pinned sibling ontology pack, and assert every projected source
  # remains byte-identical. Building from the pinned source checkout avoids the
  # invalid `cargo install` boundary for an unpublished workspace binary.
  ggen-sync:
    name: ggen sync conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: wasm4pm

      - uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/wasm4pm-compat
          ref: ${{ env.COMPAT_REV }}
          path: wasm4pm-compat

      - uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.GGEN_REV }}
          path: ggen

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache pinned ggen build
        uses: actions/cache@v4
        with:
          path: ggen/target
          key: ggen-source-${{ runner.os }}-${{ env.GGEN_REV }}-${{ hashFiles('ggen/Cargo.lock') }}

      - name: Build pinned ggen
        shell: bash
        run: |
          set -o pipefail
          cargo build \
            --manifest-path ggen/crates/ggen-cli/Cargo.toml \
            --bin ggen \
            --locked 2>&1 | tee ggen-build.log

      - name: Run ggen sync
        working-directory: wasm4pm
        shell: bash
        run: |
          set -o pipefail
          ../ggen/target/debug/ggen sync 2>&1 | tee ../ggen-sync.log

      - name: Assert rendered sources unchanged
        working-directory: wasm4pm
        run: |
          # Receipts legitimately change on every sync; only projected source
          # surfaces must be byte-identical.
          git diff --exit-code -- ':!.ggen/receipts' \
            || { echo "::error::ggen sync produced drift — rendered sources do not conform to the ontology pack"; exit 1; }

      - name: Verify Ed25519 receipt signature
        working-directory: wasm4pm
        run: |
          ../ggen/target/debug/ggen receipt verify \
            --receipt-path .ggen/receipts/latest.json \
            --public-key .ggen/keys/verifying.key 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['is_valid'], d['message']; print('receipt verified:', d['message'])"

      - name: Upload ggen receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggen-conformance-receipt
          path: |
            ggen-build.log
            ggen-sync.log
          if-no-files-found: error
          retention-days: 7
