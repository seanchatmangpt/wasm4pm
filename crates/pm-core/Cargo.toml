[package]
name = "pm-core"
version.workspace = true
edition = "2021"
description = "Zero-cost process-mining types from paper formal definitions — shareable without wasm4pm"
license = "MIT OR Apache-2.0"
keywords = ["process-mining", "petri-net", "event-log", "dfg", "conformance"]
categories = ["science", "data-structures"]
repository = "https://github.com/wasm4pm/pm-core"

[features]
default = []
std = ["serde_json?/std"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["std"] }

# This crate is no_std + alloc. No WASM, no CLI, no algorithm implementations.
# Add to your Rust process-mining library with:
#   pm-core = { path = "../pm-core" }  (local)
#   pm-core = "0.1"                    (crates.io, future)
