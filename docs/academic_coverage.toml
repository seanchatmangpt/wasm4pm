# docs/academic_coverage.toml
# ACADEMIC-COVERAGE-001 — Machine-readable academic coverage ledger
#
# This is the PRIMARY source of truth. docs/ACADEMIC_COVERAGE.md is derived from this.
#
# Gate: ALIVE only when:
#   1. Every registered algorithm is classified
#   2. Every primitive doc has paper grounding or honest non-paper classification
#   3. Every direct citation maps to a formal object
#   4. Every formal object maps to implementation files
#   5. Every implementation has positive and negative proof surfaces
#   6. Every reachable claim maps to WASM/CLI/registry/docs
#   7. Every future item is marked future, not silently implied alive
#
# Papers key format: author_shortname_keyword_year
# (Full bibliographic entries belong in docs/ACADEMIC_COVERAGE.md)

[meta]
gate = "ACADEMIC-COVERAGE-001"
status = "partial"          # Change to "alive" when all 7 gate criteria are met
version = "v26.5.30"
primitive_count = 10        # One record per primitives/0N-*.md doc
algorithm_count = 60        # Must match packages/kernel/src/registry.ts (verified 2026-05-30)
last_reviewed = "2026-05-30"

