[package]
name = "prolog8"
version = "26.7.1"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman"]
repository = "https://github.com/seanchatmangpt/wasm4pm"
description = "Prolog8 — byte-capped proof engine for policy, workflow, and agent action admission"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
smallvec = { workspace = true }

wasm-bindgen = { version = "0.2.92", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "inference"
harness = false
