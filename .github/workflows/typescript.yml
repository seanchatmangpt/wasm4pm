name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Rust + wasm-pack are required before pnpm resolution because
      # @wasm4pm/cognition depends on the local wasm-pack package outputs.
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm4pm

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the core WASM Node.js target so downstream TS packages can import it.
      - name: Build WASM (Node.js target)
        working-directory: ./wasm4pm
        run: npm run build:nodejs

      - name: Build all packages
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee "typescript-build-${{ matrix.node-version }}.log"

      - name: Upload TypeScript build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-build-node-${{ matrix.node-version }}
          path: typescript-build-${{ matrix.node-version }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint all packages
        run: pnpm run lint

      # npm dependency vulnerability scan (complement to cargo audit in test.yml)
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Test all packages
        run: npm test
        timeout-minutes: 15
