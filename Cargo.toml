[workspace]
resolver = "2"

members = ["wasm4pm", "tps-metrics", "crates/wasm4pm-cli", "crates/miniml-core", "crates/wasm4pm-cognition", "crates/prolog8", "crates/ocpq", "crates/bench-tools", "crates/wasm4pm-planner", "crates/wasm4pm-bindings-py", "crates/wasm4pm-cmca", "crates/wasm4pm-ex4pm-bindings", "crates/wasm4pm-sa2a-actuator"]
# wasm4pm-lsp was removed in v26.7.1: it depended on an out-of-repo path crate
# `lsp-max` and could not build in a clean checkout. Revival path: restore from
# git history (crates/wasm4pm-lsp @ pre-26.7.1) once lsp-max is vendored or published.

[workspace.package]
version = "26.9.30"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde", "js"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
itertools = "0.15.0"
rustc-hash = "2"
blake3 = "1.5"
tracing = { version = "0.1", default-features = false }
sha2 = "0.10.8"
bcinr = { version = "26.4.22" }
# CMCA's live allocator surface is ahead of the merged v26.9.28 source. Pin the
# canonical BCINR repository at an exact SHA so source identity and executable
# behavior are one admitted subject.
bcinr-cmca = { git = "https://github.com/seanchatmangpt/bcinr", rev = "da50f4706aef47c3720868f33f1f29d585dc6466", package = "bcinr-cmca", features = ["std"] }
bcinr-powl = { version = "26.6.25", features = ["std"] }
wasm4pm-compat = { version = "26.8.7", features = ["formats", "strict", "wasm4pm"] }
wasm4pm = { version = "26.9.30", path = "wasm4pm", features = ["cloud"] }
affidavit = { version = "26.6.22", features = ["core"] }
wasm4pm-cognition = { version = "26.9.30", path = "crates/wasm4pm-cognition" }
prolog8 = { version = "26.9.30", path = "crates/prolog8" }
miniml = { version = "26.9.30", path = "crates/miniml-core" }
ocpq = { version = "26.9.30", path = "crates/ocpq" }
fake = "2.9"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
regex = "1.10"
anyhow = "1.0"
colored = "2.1"
git2 = "0.21"
ed25519-dalek = "2.1"
serde_json_canonicalizer = "0.3.2"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = false
