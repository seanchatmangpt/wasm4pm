name: Release & Publish

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.release/retry-v26.7.23'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+simd128"

jobs:
  verify-release:
    name: Verify Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install release tools
        run: |
          npm install -g wasm-pack@0.13.1
          cargo install cargo-audit --locked

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release gates
        run: bash .github/scripts/verify-release.sh

      - name: Verify version consistency
        run: bash .github/scripts/verify-versions.sh

      - name: Verify algorithm parity
        working-directory: ./wasm4pm
        run: bash ../.github/scripts/verify-parity.sh

      - name: Run security audit
        working-directory: ./wasm4pm
        run: cargo audit --deny warnings

      - name: Generate SBOM
        run: bash .github/scripts/generate-sbom.sh

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            .github/verification-report.md
            sbom-*.json
          if-no-files-found: warn
          retention-days: 30

  smoke-test:
    name: npm Install Smoke Test
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build nodejs target
        working-directory: ./wasm4pm
        run: npm run build:nodejs

      - name: Remove wasm-pack generated ignore file
        run: rm -f wasm4pm/pkg/.gitignore

      - name: Pack and install from tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(cd wasm4pm && npm pack --silent)
          smoke_dir=$(mktemp -d)
          cp "wasm4pm/${tarball}" "$smoke_dir/"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install "./${tarball}"
          echo "SMOKE_DIR=$smoke_dir" >> "$GITHUB_ENV"

      - name: Verify exports and WASM execution
        working-directory: ${{ env.SMOKE_DIR }}
        run: |
          node - <<'NODE'
          const pm = require('wasm4pm');
          for (const name of [
            'WasmEventLog',
            'WasmOCEL',
            'discover_dfg',
            'discover_alpha_plus_plus',
            'discover_heuristic_miner',
            'load_eventlog_from_json',
            'get_version',
            'clear_all_objects',
          ]) {
            if (pm[name] === undefined) throw new Error(`${name} missing`);
          }

          const sv = (value) => ({ tag: 'String', value });
          const log = JSON.stringify({
            attributes: {},
            traces: [
              { attributes: {}, events: [
                { attributes: { 'concept:name': sv('A') } },
                { attributes: { 'concept:name': sv('B') } },
              ] },
              { attributes: {}, events: [
                { attributes: { 'concept:name': sv('A') } },
                { attributes: { 'concept:name': sv('C') } },
              ] },
            ],
          });
          const handle = pm.load_eventlog_from_json(log);
          pm.discover_dfg(handle, 'concept:name');
          pm.clear_all_objects();
          console.log('Smoke test passed:', pm.get_version());
          NODE

      - name: Cleanup
        if: always()
        run: rm -rf "${SMOKE_DIR:-}"

  build-release:
    name: Build Release Artifacts
    needs: [verify-release, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          npm install -g wasm-pack@0.13.1 wasm-opt

      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM targets
        working-directory: ./wasm4pm
        run: npm run build:all

      - name: Build TypeScript workspace in dependency order
        run: pnpm -r build

      - name: Generate schemas and types
        run: bash .github/scripts/generate-schemas.sh

      - name: Generate Rust documentation
        working-directory: ./wasm4pm
        run: cargo doc --no-deps --release

      - name: Run release tests
        working-directory: ./wasm4pm
        run: npm test
        timeout-minutes: 30

      - name: Generate changelog
        run: bash .github/scripts/generate-changelog.sh

      - name: Build release notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo "# Release ${version}"
            echo
            cat CHANGELOG_RELEASE.md
            echo
            echo "## Build receipt"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- WASM targets: bundler, nodejs, web"
            echo "- Node.js: 22"
            echo "- Rust: stable"
          } > release-notes.md

      - name: Upload Rust documentation
        uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: ./wasm4pm/target/doc/
          retention-days: 30

      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: |
            release-notes.md
            CHANGELOG_RELEASE.md
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Release Notification
    needs: [verify-release, smoke-test, build-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check release status
        shell: bash
        run: |
          if [[ "${{ needs.verify-release.result }}" == success \
             && "${{ needs.smoke-test.result }}" == success \
             && "${{ needs.build-release.result }}" == success ]]; then
            echo "Release verification completed successfully."
          else
            echo "::error::Release verification failed."
            exit 1
          fi
