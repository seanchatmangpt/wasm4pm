[features]
ocel = []

# Gall Checkpoint Doctrine conformance (no extra deps — uses wasm4pm-compat types only)
feature-gall = []
# ─────────────────────────────────────────────────────────────────────────────
# CANONICAL FEATURE FLAGS
# These are the authoritative semantic features for API stability.
# Internal features (below) map to these canonical names.
# ─────────────────────────────────────────────────────────────────────────────

# Conformance checking (fitness, precision, generalization)
feature-conformance-basic = ["conformance_basic"]
feature-conformance-full = ["feature-conformance-basic", "conformance_full", "alignment_fitness", "align_etconformance"]

# Discovery algorithms (advanced = genetic, ILP, ACO, PSO)
feature-discovery-advanced = ["discovery_advanced", "genetic", "ilp", "a_star", "aco", "pso", "simulated_annealing"]

# Machine learning (classification, clustering, forecasting, anomaly, regression, PCA)
feature-ml = ["ml", "ml_classify", "ml_cluster", "ml_forecast", "ml_anomaly", "ml_regress", "ml_pca"]

# Object-centric event logs
feature-ocel = ["ocel"]

# Partial-order workflows
feature-powl = ["powl"]

# Streaming algorithms (basic = DFG streaming)
feature-streaming-basic = ["streaming_basic", "streaming_dfg"]

# Streaming algorithms (full = SIMD-accelerated)
feature-streaming-full = ["feature-streaming-basic", "streaming_full", "streaming_basic", "simd"]

# Hand-rolled statistics (size optimization)
feature-hand-rolled-stats = ["hand_rolled_stats"]

# Full-precision statistics (full statrs library)
feature-statrs = ["statrs", "dep:statrs"]

# GPU-accelerated LinUCB contextual bandit (NOT for wasm32 — targets native GPU: Vulkan/Metal/DX12)
# PREREQUISITE: add `wgpu = { version = "0.19", optional = true }` and
#               `pollster = { version = "0.3", optional = true }` to [dependencies],
#               then change this to feature-gpu = ["gpu", "dep:wgpu", "dep:pollster"].
# Until those deps are added the internal "gpu" flag is NOT activated to prevent
# compile errors from missing wgpu/pollster crates.
feature-gpu = []

# Parallel processing via rayon (NOT for wasm32 — WASM is single-threaded)
# PREREQUISITE: add `rayon = { version = "1", optional = true }` to [dependencies],
#               then change this to feature-rayon = ["rayon", "dep:rayon"].
# Until that dep is added the internal "rayon" flag is NOT activated.
feature-rayon = []

# Branchless algorithms (bcinr integration)
bcinr = ["dep:bcinr"]

# Proof-carrying POWL workflow execution engine (bcinr-powl integration)
powl-engine = ["dep:bcinr-powl"]

# Cognition kernel re-export (wasm4pm-cognition substrate)
cognition = ["dep:wasm4pm-cognition"]

# Default: no canonical features (baseline admissibility with browser profile below)
default = ["browser"]

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT PROFILES
# ─────────────────────────────────────────────────────────────────────────────

# Mobile profile (~500KB): Minimal features for mobile devices
mobile = [
  "feature-conformance-basic",
  "feature-gall",
  "feature-hand-rolled-stats",
  "conformance_basic",
  "bcinr"
]

# IoT profile (~1MB): Minimal features for IoT devices
iot = [
  "feature-conformance-basic",
  "feature-gall",
  "feature-hand-rolled-stats",
  "discovery_basic",
  "conformance_basic",
  "bcinr"
]

# Edge profile (~1.5MB): Advanced algorithms for edge servers (CDN workers)
edge = [
  "feature-conformance-basic",
  "feature-discovery-advanced",
  "feature-gall",
  "feature-streaming-basic",
  "feature-hand-rolled-stats",
  "discovery_advanced",
  "conformance_basic",
  "bcinr"
]

# Fog profile (~2MB): Full features except POWL for fog computing
fog = [
  "feature-conformance-full",
  "feature-discovery-advanced",
  "feature-gall",
  "feature-ml",
  "feature-streaming-full",
  "feature-ocel",
  "feature-statrs",
  "discovery_advanced",
  "conformance_full",
  "ml",
  "streaming_full",
  "statrs",
  "ocel",
  "bcinr"
]

# Browser profile (~2.78MB): Full feature set for web browsers (DEFAULT)
browser = [
  "feature-conformance-full",
  "feature-discovery-advanced",
  "feature-gall",
  "feature-ml",
  "feature-streaming-full",
  "feature-ocel",
  "feature-powl",
  "feature-statrs",
  "discovery_advanced",
  "conformance_full",
  "ml",
  "streaming_full",
  "petri_net_playout",
  "extensive_playout",
  "montecarlo",
  "statrs",
  "ocel",
  "powl",
  "powl-engine",
  "console_error_panic_hook",
  "import"
]

# Cloud profile: removed alias for browser profile
cloud = ["browser"]

# ─────────────────────────────────────────────────────────────────────────────
# INTERNAL FEATURE FLAGS
# Used for #[cfg(feature = "...")] module gating in src/*.rs
# ─────────────────────────────────────────────────────────────────────────────

# Discovery algorithms
discovery_basic = ["alpha_plus_plus", "heuristic_miner", "inductive_miner"]
discovery_advanced = ["discovery_basic", "genetic", "ilp", "a_star", "aco", "pso", "simulated_annealing"]

# Individual discovery algorithms
alpha_plus_plus = []
heuristic_miner = []
inductive_miner = []
genetic = []
ilp = []
a_star = []
aco = []
pso = []
simulated_annealing = []

# Conformance
conformance_basic = []
conformance_full = ["conformance_basic", "alignment_fitness", "align_etconformance"]

# ML/Prediction
ml = []
ml_classify = []
ml_cluster = []
ml_forecast = []
ml_anomaly = []
ml_regress = []
ml_pca = []

# Streaming
streaming_basic = ["streaming_dfg"]
streaming_full = ["streaming_basic", "simd"]
streaming_dfg = []

# Conformance modules
alignment_fitness = []
petri_net_playout = []
extensive_playout = []
align_etconformance = []
montecarlo = []

# Dependencies
statrs = ["dep:statrs"]
miniml = ["dep:miniml"]
gpu = []
# rayon — no-op flag (rayon crate not yet added as dep; flag exists so feature-rayon
# can be declared without cargo errors; parallel_executor.rs guards rayon use internally)
rayon = []
powl = []
serde = []


# Utility features
hand_rolled_stats = []
simd = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

# Proof-of-concept gate validator (in-memory HashSet, NOT SPARQL-backed)
# NEVER include in browser/cloud/fog/edge/iot/mobile deployment profiles
poc_gate_validator = []

# AutoML membrane layer (forward guard — src/automembrane.rs not yet created)
# NEVER include in any deployment profile until real model is implemented
automl_experimental = []

import = []

