[workspace]
resolver = "2"

members = ["wasm4pm", "tps-metrics", "crates/wasm4pm-cli", "crates/miniml-core", "crates/wasm4pm-cognition", "crates/prolog8", "crates/ocpq"]

[workspace.package]
version = "26.6.9"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman <info@chatmangpt.com>"]
repository = "https://github.com/seanchatmangpt/wasm4pm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde", "js"] }
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
itertools = "0.14.0"
rustc-hash = "2"
blake3 = "1.5"
tracing = { version = "0.1", default-features = false }
sha2 = "0.10.8"
bcinr = { version = "26.4.22" }
wasm4pm-compat = { version = "26.6.8" }
wasm4pm = { version = "26.6.9", path = "wasm4pm", features = ["cloud"] }
wasm4pm-cognition = { version = "26.6.9", path = "crates/wasm4pm-cognition" }
prolog8 = { version = "26.6.9", path = "crates/prolog8" }
miniml = { version = "26.6.9", path = "crates/miniml-core" }
ocpq = { version = "26.6.9", path = "crates/ocpq" }
fake = "2.9"
proptest = "1.4"
tempfile = "3.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
opt-level = 3
lto = false
