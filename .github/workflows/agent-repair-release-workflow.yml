name: Repair Release Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-repair-release-workflow.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pnpm11-build-allowlist
          fetch-depth: 0

      - name: Repair release install and publication boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/release.yml')
          text = path.read_text()

          trigger_old = """on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
"""
          trigger_new = """on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.release/retry-v26.7.23'
  workflow_dispatch:
"""
          if text.count(trigger_old) != 1:
              raise SystemExit('release trigger shape changed unexpectedly')
          text = text.replace(trigger_old, trigger_new, 1)

          install_old = """      - name: Install dependencies
        run: pnpm install
"""
          install_new = """      - name: Bootstrap cognition WASM packages
        run: bash scripts/bootstrap-cognition-wasm.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
"""
          install_count = text.count(install_old)
          if install_count != 3:
              raise SystemExit(f'expected three release install steps, found {install_count}')
          text = text.replace(install_old, install_new)

          duplicate_publish = re.compile(
              r"\n      # Publish Rust crate \(optional, if wasm4pm is published to crates\.io\)\n"
              r"      - name: Publish to crates\.io\n"
              r"        working-directory: \./wasm4pm\n"
              r"        run: \|\n"
              r"          echo \"Publishing Rust crate to crates\.io\.\.\.\"\n"
              r"          cargo publish --token \"\$\{\{ secrets\.CARGO_TOKEN \}\}\"\n"
              r"        continue-on-error: true\n"
              r"        if: startsWith\(github\.ref, 'refs/tags/'\)\n"
          )
          text, removed = duplicate_publish.subn('\n', text, count=1)
          if removed != 1:
              raise SystemExit(f'expected one duplicate Rust publisher, removed {removed}')

          path.write_text(text)
          PY

      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'

      - name: Commit verified release workflow
        shell: bash
        run: |
          rm .github/workflows/agent-repair-release-workflow.yml
          git config user.name "wasm4pm-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/release.yml .github/workflows/agent-repair-release-workflow.yml
          git commit -m "fix(release): restore frozen bootstrap and single publish authority"
          git push origin HEAD:agent/fix-pnpm11-build-allowlist
