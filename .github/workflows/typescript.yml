name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Rust + wasm-pack are required before pnpm build because TypeScript packages
      # import from wasm4pm/pkg-nodejs/, which wasm-pack produces.
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm4pm

      - name: Install wasm-pack
        run: npm install -g wasm-pack@0.13.1

      - name: Install dependencies
        run: pnpm install

      # Build WASM Node.js target first so downstream TS packages can import it
      - name: Build WASM (Node.js target)
        working-directory: ./wasm4pm
        run: npm run build:nodejs

      - name: Build all packages
        run: pnpm run build

      - name: Lint all packages
        run: pnpm run lint

      # npm dependency vulnerability scan (complement to cargo audit in test.yml)
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Test all packages
        run: npm test
        timeout-minutes: 15
