[package]
name = "wasm4pm"
version = "26.7.23"
edition = "2021"
license = "BUSL-1.1"
authors = ["Sean Chatman"]
repository = "https://github.com/seanchatmangpt/wasm4pm"
description = "High-performance process mining algorithms in WebAssembly for JavaScript/TypeScript"
documentation = "https://docs.rs/wasm4pm"
homepage = "https://github.com/seanchatmangpt/wasm4pm"
readme = "README.md"
keywords = [
    "process-mining",
    "wasm",
    "webassembly",
    "petri-net",
    "bpm",
]
categories = [
    "wasm",
    "algorithms",
    "data-structures",
    "science",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm4pm-compat = { workspace = true, features = ["formats", "strict", "wasm4pm"] }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
wasm-bindgen-futures = "0.4.42"
serde_json = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
thiserror = "1"
once_cell = "1.19"
uuid = { version = "1.16.0", features = ["v4"] }
chrono = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }
itertools = { workspace = true }
rustc-hash = { workspace = true }
hashbrown = { workspace = true }
smallvec = { workspace = true }
roxmltree = "0.19"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.37", features = ["serialize"] }
csv = "1.3"
fastrand = "2.1.0"
rand = "0.8"
rand_distr = "0.4"
tracing = "0.1"
statrs = { version = "0.17", default-features = false, optional = true }
bcinr = { workspace = true, optional = true }
bcinr-powl = { workspace = true, optional = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
wasm4pm-cognition = { workspace = true, default-features = false, optional = true }
miniml = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.16.0", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
simd-json = "0.13"
lazy_static = "1.4"
fake = { workspace = true }
proptest = { workspace = true }
insta = { version = "1", features = ["json"] }
wasm-bindgen-test = "0.3"
tempfile = { workspace = true }
regex = "1"
naga = { version = "0.19", features = ["wgsl-in"] }
miniml = { workspace = true }

