name: WIP Limit Check

on:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-wip-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load WIP config
        id: config
        run: |
          MAX_PRS=$(jq -r '.max_concurrent_prs' .wasm4pm/wip-config.json)
          echo "max_prs=$MAX_PRS" >> "$GITHUB_OUTPUT"
          echo "Loaded WIP config: max_concurrent_prs=$MAX_PRS"

      - name: Check PR author concurrent PRs
        id: check_prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          CURRENT_PR="${{ github.event.pull_request.number }}"

          # Draft PRs are staging work and do not consume review WIP. Query the
          # structured isDraft field instead of relying on fragile search syntax.
          OPEN_PRS=$(gh pr list \
            --author "$AUTHOR" \
            --state open \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json number,isDraft \
            --jq '[.[] | select(.isDraft == false)] | length')

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "total_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          echo "User '$AUTHOR' has $OPEN_PRS open non-draft PRs while evaluating #$CURRENT_PR"

      - name: Comment on excessive WIP
        if: steps.check_prs.outputs.total_prs > steps.config.outputs.max_prs
        uses: actions/github-script@v7
        with:
          script: |-
            const maxPrs = parseInt('${{ steps.config.outputs.max_prs }}');
            const openPrs = parseInt('${{ steps.check_prs.outputs.total_prs }}');
            const author = '${{ steps.check_prs.outputs.author }}';

            const comment = [
              '⚠️ WIP Limit Exceeded',
              '',
              'You currently have ' + openPrs + ' open non-draft PRs (limit: ' + maxPrs + ').',
              '',
              'Per Toyota Production System principles, review-active work is limited to prevent context thrashing. Draft PRs are excluded.',
              '',
              'Action Required:',
              '1. Merge, close, or convert an existing review-active PR to draft',
              '2. Then proceed with this PR',
              '',
              'Open review-active PRs:',
              (openPrs > maxPrs ? '⚠️ Exceeds limit by ' + (openPrs - maxPrs) : '✅ Within limit'),
              '',
              'See .wasm4pm/wip-config.json for the configured limit.'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if WIP limit exceeded
        if: steps.check_prs.outputs.total_prs > steps.config.outputs.max_prs
        run: |
          echo "❌ WIP limit exceeded: ${{ steps.check_prs.outputs.total_prs }} open non-draft PRs (max: ${{ steps.config.outputs.max_prs }})"
          echo ""
          echo "See: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          exit 1

      - name: Success - WIP limit OK
        if: steps.check_prs.outputs.total_prs <= steps.config.outputs.max_prs
        run: |
          echo "✅ WIP limit check passed: ${{ steps.check_prs.outputs.total_prs }}/${{ steps.config.outputs.max_prs }} non-draft PRs"
