[package]
name = "pictl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High-performance process mining algorithms in WebAssembly for JavaScript/TypeScript"
documentation = "https://docs.rs/pictl"
homepage = "https://github.com/seanchatmangpt/pictl"
readme = "README.md"
keywords = [
    "process-mining",
    "wasm",
    "webassembly",
    "petri-net",
    "bpm",
]
categories = [
    "wasm",
    "algorithms",
    "data-structures",
    "science",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pictl-types = { path = "../crates/pictl-types" }
wasm-bindgen = "0.2.92"
js-sys = "0.3"
wasm-bindgen-futures = "0.4.42"
serde_json = "1.0.105"
serde = { version = "1.0.188", features = ["derive"] }
serde-wasm-bindgen = "0.6"
once_cell = "1.19"
uuid = { version = "1.16.0", features = ["v4"] }
chrono = { version = "0.4.40", features = ["serde"] }
console_error_panic_hook = { version = "0.1", optional = true }
itertools = "0.14.0"
rustc-hash = "2"
hashbrown = { version = "0.17", features = ["inline-more"] }
smallvec = { version = "1.13", features = ["serde"] }
roxmltree = "0.19"
fastrand = "2.1.0"
rand = "0.8"
rand_distr = "0.4"
statrs = { version = "0.17", default-features = false, optional = true }
rayon = { version = "1.10", optional = true }
wgpu     = { version = "0.19", optional = true }
pollster = { version = "0.3",  optional = true }
bcinr-core = { path = "../../bcinr/bcinr-core", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [] }
uuid = { version = "1.16.0", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
simd-json = "0.13"
blake3 = "1"
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
lazy_static = "1.4"

