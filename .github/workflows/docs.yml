name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.mlc.config.json'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.mlc.config.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BEFORE_SHA: ${{ github.event.before }}
  CURRENT_SHA: ${{ github.sha }}

jobs:
  lint:
    name: Lint changed maintained Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Admit changed maintained documents
        id: documents
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$CURRENT_SHA"
          else
            git diff-tree --root --no-commit-id --name-only -r --diff-filter=ACMR HEAD
          fi | while IFS= read -r path; do
            [[ "$path" == *.md ]] || continue
            case "$path" in
              docs_quarantine/*|docs/archive/*|artifacts/*|reports/*|scratch/*|lab/reports/*)
                continue
                ;;
            esac
            printf '%s\n' "$path"
          done | sort -u | tee changed-markdown.txt

          count=$(wc -l < changed-markdown.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Admitted $count changed maintained Markdown file(s)."

      - name: Lint admitted Markdown
        if: steps.documents.outputs.count != '0'
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < changed-markdown.txt
          markdownlint "${files[@]}" --config .markdownlint.json 2>&1 | tee markdownlint-receipt.log

      - name: Record empty lint receipt
        if: steps.documents.outputs.count == '0'
        run: echo "No changed maintained Markdown files were admitted." | tee markdownlint-receipt.log

      - name: Upload markdownlint receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdownlint-receipt
          path: |
            changed-markdown.txt
            markdownlint-receipt.log
          if-no-files-found: error
          retention-days: 7

  link-check:
    name: Check links in changed maintained Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Admit changed maintained documents
        id: documents
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$CURRENT_SHA"
          else
            git diff-tree --root --no-commit-id --name-only -r --diff-filter=ACMR HEAD
          fi | while IFS= read -r path; do
            [[ "$path" == *.md ]] || continue
            case "$path" in
              docs_quarantine/*|docs/archive/*|artifacts/*|reports/*|scratch/*|lab/reports/*)
                continue
                ;;
            esac
            printf '%s\n' "$path"
          done | sort -u | tee changed-markdown.txt

          count=$(wc -l < changed-markdown.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Admitted $count changed maintained Markdown file(s)."

      - name: Check links in admitted Markdown
        if: steps.documents.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          : > markdown-link-check-receipt.log
          status=0
          while IFS= read -r file; do
            markdown-link-check "$file" --config .mlc.config.json >> markdown-link-check-receipt.log 2>&1 || status=1
          done < changed-markdown.txt
          cat markdown-link-check-receipt.log
          exit "$status"

      - name: Record empty link receipt
        if: steps.documents.outputs.count == '0'
        run: echo "No changed maintained Markdown files were admitted." | tee markdown-link-check-receipt.log

      - name: Upload link-check receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-link-check-receipt
          path: |
            changed-markdown.txt
            markdown-link-check-receipt.log
          if-no-files-found: error
          retention-days: 7
