[package]
name = "wasm4pm-algos"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-performance, branchless algorithm implementations for wasm4pm process mining"
repository = "https://github.com/seanchatmangpt/wasm4pm"
documentation = "https://docs.rs/wasm4pm-algos"
readme = "README.md"

[dependencies]
wasm4pm-compat.workspace = true
wasm4pm-types.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
hashbrown = { workspace = true }
smallvec = { workspace = true }
itertools = { workspace = true }
blake3 = { workspace = true }
bcinr = { workspace = true, optional = true }
ocel-core = { workspace = true }

[features]
bcinr = ["dep:bcinr"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
