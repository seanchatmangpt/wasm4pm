[package]
name = "tps-metrics"
version = "0.1.0"
edition = "2021"
description = "Toyota Production System metrics collection and analysis"
authors = ["Sean Chatman <info@chatmangpt.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/pictl"

[dependencies]
git2 = "0.18"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
colored = "2.1"

[[bin]]
name = "tps-metrics"
path = "src/main.rs"
